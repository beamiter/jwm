[package]
name = "jwm-bridge"
version = "0.1.0"
edition = "2024"
description = "freedesktop D-Bus services (notifications) bridged onto the jwm shell"
license = "MIT"

[[bin]]
name = "jwm-bridge"
path = "src/main.rs"

[[bin]]
name = "jwm-player"
path = "src/bin/jwm_player.rs"

[dependencies]
jwm_ipc_client = { path = "../crates/jwm_ipc_client" }
jwm_ipc_transport = { path = "../crates/jwm_ipc_transport" }
# Keep independent executor capacity for notification discovery and media work;
# applications can synchronously wait for GetCapabilities before drawing UI.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

# D-Bus session bus service.
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"

futures-util = "0.3"
serde_json = "1"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
