[package]
name = "jwm-demo-client"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde_json = "1"
x11rb = "0.14.0"

# Keep this independently built demo binary out of JWM's core workspace. The
# video runner invokes Cargo with this manifest directly.
[workspace]
resolver = "3"
