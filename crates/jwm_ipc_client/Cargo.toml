[package]
name = "jwm_ipc_client"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Shared bounded command, query and subscription client for JWM"

[dependencies]
jwm_ipc_transport = { path = "../jwm_ipc_transport" }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["sync"] }
log = "0.4"
