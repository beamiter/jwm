name: Sanitizers

# 共享内存 + 原子游标代码的深度检查：ASan/TSan 跑满三个后端矩阵。
# 构建 build-std 较慢，只在每周定时与手动触发时运行。
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  sanitize:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: ./san.sh ${{ matrix.sanitizer }}
