[package]
name = "jwm_file_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

# Kept isolated from the compositor and from future GTK/GVFS bindings.
[workspace]

[target.'cfg(target_os = "linux")'.dependencies]
png = { version = "=0.18.1", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
