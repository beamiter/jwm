[package]
name = "jwm-apps"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native JWM notes and image viewer applications"
license = "MIT"

[[bin]]
name = "jwm-notes"
path = "src/bin/notes.rs"

[[bin]]
name = "jwm-image-viewer"
path = "src/bin/image_viewer.rs"

[dependencies]
cairo-rs = "0.22.9"
pango = "0.22.9"
pangocairo = "0.22.9"
gio = "0.22.8"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
unicode-segmentation = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "pnm"] }

[profile.dev]
debug = 0
