[package]
name = "xbar_core"
version = "0.9.1"
edition = "2024"
description = "Backend-neutral status-bar model, frontend projection, runtime, and explicit adapters"
repository = "https://github.com/beamiter/xbar_core"

[features]
# The semantic model is the only default surface. Every platform capability is
# explicit so a toolkit or GPU frontend never inherits Cairo, ALSA, sysfs, or
# Linux fd dependencies accidentally.
default = []

clock-chrono = ["dep:chrono"]
config-toml = ["dep:toml"]
# Frosted-glass backdrop. The core is integer pixel math with no toolkit
# dependency; `glass-wallpaper` adds the file-backed source, which is the only
# part that needs an image decoder.
glass = ["dep:log"]
glass-wallpaper = ["glass", "dep:image"]
logging-flexi = ["dep:anyhow", "dep:flexi_logger", "dep:log"]
provider-alsa = ["dep:alsa", "dep:anyhow", "dep:log"]
provider-battery-sysfs = []
provider-brightnessctl = ["dep:log"]
provider-network-sysfs = []
provider-system = ["dep:sysinfo"]
render-cairo = ["dep:anyhow", "dep:cairo-rs", "dep:image", "dep:pango", "dep:pangocairo"]
runtime-linux = ["dep:libc", "dep:log"]
transport-shared = ["dep:shared_structures"]

[dependencies]
anyhow = { version = "1.0.103", optional = true }
chrono = { version = "0.4.45", optional = true }
sysinfo = { version = "0.39.6", features = ["multithread"], optional = true }

# In-tree sibling: the monorepo working tree is the protocol revision, so
# every consumer of xbar_core resolves the same shared_structures by
# construction — no tag/rev to keep in sync.
shared_structures = { path = "../shared_structures", features = ["use-futex"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
toml = { version = "0.9.8", optional = true }

alsa = { version = "0.12.0", optional = true }
log = { version = "0.4.33", optional = true }
flexi_logger = { version = "0.31.9", optional = true }
libc = { version = "0.2.186", optional = true }

# Only the formats JWM's own wallpaper loader accepts, and no rayon: a bar
# decodes one image at startup, not a batch.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
], optional = true }

cairo-rs = { version = "0.22.0", optional = true }
pango = { version = "0.22.8", optional = true }
pangocairo = { version = "0.22.8", optional = true }

[dev-dependencies]
serde_json = "1.0.145"
