[package]
name = "xbar_tauri"
version = "0.1.0"
edition = "2024"
description = "Tauri 2 host bridge for xbar_core"
repository = "https://github.com/beamiter/xbar_core"

# This GUI adapter is intentionally outside JWM's core workspace. An explicit
# boundary also makes its own checks work when Cargo walks through xbar_core.
[workspace]

[features]
default = []
clock-chrono = ["xbar_core/clock-chrono"]
provider-alsa = ["xbar_core/provider-alsa"]
provider-battery-sysfs = ["xbar_core/provider-battery-sysfs"]
provider-brightnessctl = ["xbar_core/provider-brightnessctl"]
provider-network-sysfs = ["xbar_core/provider-network-sysfs"]
provider-system = ["xbar_core/provider-system"]

[dependencies]
log = "0.4.33"
tauri = { version = "~2.12.5", default-features = false }
xbar_core = { path = "../..", default-features = false, features = [
    "config-toml",
    "glass-wallpaper",
    "transport-shared",
] }
xbar_linux_actions = { path = "../xbar_linux_actions" }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
tauri = { version = "~2.12.5", default-features = false, features = ["wry"] }
raw-window-handle = "0.6"
x11rb = "0.14"

[dev-dependencies]
tauri = { version = "~2.12.5", default-features = false, features = ["wry"] }

# GTK3 compatibility: upstream RUSTSEC-2024-0429 fix, see vendor/glib/JWM-BACKPORT.md.
[patch.crates-io]
glib = { path = "../../../../vendor/glib" }
