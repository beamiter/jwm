name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: xbar_core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: xbar_core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: beamiter/shared_structures
          ref: 9ebabcd3f849fbf83ceb5eaff5c8fa136c396f64
          path: shared_structures
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy,rustfmt
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcairo2-dev libpango1.0-dev libwebkit2gtk-4.1-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --no-default-features
      - name: Check every adapter independently
        run: |
          for feature in clock-chrono config-toml logging-flexi provider-alsa provider-battery-sysfs provider-brightnessctl provider-network-sysfs provider-system render-cairo runtime-linux transport-shared; do
            cargo check --no-default-features --all-targets --features "$feature"
          done
      - run: cargo test --no-default-features --features render-cairo
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  consumer-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - repo: xcb_bar
            ref: 827a0b2350ad211f16971260cdafd88c7b52da12
            extra: ""
          - repo: iced_bar
            ref: dd2b2b2321b931af05a9da980ad2ec302e4a9b6e
            extra: ""
          - repo: gtk_bar
            ref: 649f495680535fc42f863e1a573f95f05fb11945
            extra: "libgtk-4-dev libadwaita-1-dev"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: xbar_core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: beamiter/shared_structures
          ref: 9ebabcd3f849fbf83ceb5eaff5c8fa136c396f64
          path: shared_structures
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: beamiter/${{ matrix.consumer.repo }}
          ref: ${{ matrix.consumer.ref }}
          path: consumer
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: consumer
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcairo2-dev libpango1.0-dev ${{ matrix.consumer.extra }}
      - name: Build the consumer against this core checkout
        working-directory: consumer
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [patch."https://github.com/beamiter/xbar_core.git"]
          xbar_core = { path = "../xbar_core" }
          xbar_linux_actions = { path = "../xbar_core/crates/xbar_linux_actions" }
          EOF
          cargo check
