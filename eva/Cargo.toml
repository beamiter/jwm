[package]
name = "jwm-eva"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Native hotkey-activated Realtime voice assistant for JWM"

[dependencies]
jwm_eva_core = { path = "../crates/jwm_eva_core" }
jwm_ipc_client = { path = "../crates/jwm_ipc_client" }
jwm_ipc_transport = { path = "../crates/jwm_ipc_transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
base64 = "0.22"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
pipewire = { version = "0.10", features = ["v0_3_50"] }
