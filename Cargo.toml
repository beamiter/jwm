[package]
name = "tao_wgpu_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
pollster = "1.0.1"
wgpu = "30.0.0"
anyhow = "1.0.103"
libc = "0.2.186"
log = "0.4.33"
xbar_core = { git = "https://github.com/beamiter/xbar_core.git", rev = "f0912c8d981af251e56b0a18a3432090fd6ba6ad", default-features = false, features = [
    "clock-chrono",
    "logging-flexi",
    "provider-alsa",
    "provider-battery-sysfs",
    "provider-brightnessctl",
    "provider-system",
    "render-cairo",
    "runtime-linux",
    "transport-shared",
] }
xbar_linux_actions = { git = "https://github.com/beamiter/xbar_core.git", rev = "f0912c8d981af251e56b0a18a3432090fd6ba6ad" }
cairo-rs = "0.22.0"
pango = "0.22.8"
raw-window-handle = "0.6.2"
tao = "0.35.3"
