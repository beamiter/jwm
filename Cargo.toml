[package]
name = "shared_structures"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = { version = "0.2.176", optional = true }
log = "0.4.28"
nix = { version = "0.30.1", features = ["event", "fs", "poll", "socket", "uio"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
bincode = { version = "2.0.1", features = ["derive", "serde"] }
serde-big-array = "0.5.1"
shared_memory = "0.12.4"
criterion = "0.7.0"

[features]
futex = ["dep:libc"]
semaphore = ["dep:libc"]
eventfd = ["dep:nix"]
default = ["futex", "semaphore", "eventfd"]

use-eventfd = []
use-futex = []
use-semaphore = []

[[bench]]
name = "ring_buffer_bench"
harness = false

[[bench]]
name = "stress_test"
harness = false
