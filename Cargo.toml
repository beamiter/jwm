[package]
name = "shared_structures"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = { version = "0.2.186", optional = true }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
rkyv = "0.8"
serde-big-array = "0.5.1"
shared_memory = "0.12.4"
criterion = "0.8.2"
nix = { version = "0.31.3", features = ["fs", "poll", "socket", "uio"] }

[features]
futex = ["dep:libc"]
semaphore = ["dep:libc"]
eventfd = []
default = ["futex", "semaphore", "eventfd"]

use-eventfd = []
use-futex = []
use-semaphore = []

[[bench]]
name = "ring_buffer_bench"
harness = false

[[bench]]
name = "stress_test"
harness = false
