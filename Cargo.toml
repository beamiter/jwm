[package]
name = "xbar_core"
version = "0.3.0"
edition = "2024"
description = "Backend-neutral status-bar model, scene graph, runtime, and explicit adapters"
repository = "https://github.com/beamiter/xbar_core"

[features]
# The semantic model is the only default surface. Every platform capability is
# explicit so a toolkit or GPU frontend never inherits Cairo, ALSA, sysfs, or
# Linux fd dependencies accidentally.
default = []

clock-chrono = ["dep:chrono"]
logging-flexi = ["dep:anyhow", "dep:flexi_logger", "dep:log"]
provider-alsa = ["dep:alsa", "dep:anyhow", "dep:log"]
provider-battery-sysfs = []
provider-brightnessctl = ["dep:log"]
provider-system = ["dep:sysinfo"]
render-cairo = ["dep:anyhow", "dep:cairo-rs", "dep:pango", "dep:pangocairo"]
runtime-linux = ["dep:libc", "dep:log"]
transport-shared = ["dep:shared_structures"]

[dependencies]
anyhow = { version = "1.0.103", optional = true }
chrono = { version = "0.4.45", optional = true }
sysinfo = { version = "0.39.6", features = ["multithread"], optional = true }

shared_structures = { git = "https://github.com/beamiter/shared_structures.git", features = ["use-futex"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }

alsa = { version = "0.12.0", optional = true }
log = { version = "0.4.33", optional = true }
flexi_logger = { version = "0.31.9", optional = true }
libc = { version = "0.2.186", optional = true }

cairo-rs = { version = "0.22.0", optional = true }
pango = { version = "0.22.8", optional = true }
pangocairo = { version = "0.22.8", optional = true }
