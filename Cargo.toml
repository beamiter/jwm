# Monorepo root: jwm plus its whole protocol stack resolve from one tree, so
# a protocol change lands atomically in shared_structures, xbar_core, jwm, and
# every bar in the same commit. The bars stay OUT of this workspace on purpose:
# their GUI frameworks (gpui, tauri, gtk4, iced, …) keep their own Cargo.lock
# under bars/<name> so their huge dependency trees never fight this one.
# xbar_tauri and xbar_present_wgpu are likewise excluded: only bars consume
# them (via path), and tauri/wgpu don't belong in the core lock.
[workspace]
members = [
    ".",
    "portal",
    "bridge",
    "crates/shared_structures",
    "crates/xbar_core",
    "crates/xbar_core/crates/xbar_linux_actions",
    "crates/xbar_core/crates/xbar_dbus_providers",
]
exclude = [
    "bars",
    "crates/xbar_core/crates/xbar_tauri",
    "crates/xbar_core/crates/xbar_present_wgpu",
]
resolver = "3"

[package]
name = "jwm"
version = "0.2.0"
edition = "2024"
# Tested minimum: the locked dependency graph requires 1.89 (smol_str), and
# `cargo +1.89.0 check --all-targets` plus the test suite pass with Cargo.lock.
rust-version = "1.89"
description = "A multi-backend X11 and Wayland window manager and compositor"
repository = "https://github.com/beamiter/jwm"
readme = "README.md"
license = "MIT"

[features]
# The default build carries every backend, exactly like the pre-feature
# builds: one binary, runtime selection via --backend / JWM_BACKEND.
# Features are additive; slim profiles opt out with --no-default-features.
default = [
    "backend-x11rb",
    "backend-xcb",
    "backend-wayland-udev",
    "backend-wayland-nested",
    "media-audio",
]
# Internal: shared X11 transport helpers and the GLX/EGL compositor.
# Enabled through the per-transport features; not selected directly.
x11-backends = ["dep:x11", "dep:x11rb-protocol"]
# Internal: shared Smithay Wayland frontend. Enabled through the per-backend
# Wayland features; not selected directly.
wayland-backends = ["dep:smithay"]
# X11RB transport + shared X11 compositor.
backend-x11rb = ["x11-backends", "dep:x11rb"]
# XCB transport + shared X11 compositor.
backend-xcb = ["x11-backends", "dep:xcb"]
# Direct Wayland DRM/KMS session backend.
backend-wayland-udev = [
    "wayland-backends",
    "dep:drm",
    "dep:drm-ffi",
    "dep:egl",
    "dep:gbm",
    "dep:libseat",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
]
# ALSA audio capture: standalone audio recording and the screen-recording
# audio track. Without it recording is video-only and audio capture reports
# that it is not compiled in.
media-audio = ["dep:alsa"]
# Counting global allocator feeding the allocation_steady performance
# scenario. Off by default: production builds keep the plain system
# allocator.
alloc-counter = []
# Nested Wayland development backends (wayland-x11 and wayland-winit).
backend-wayland-nested = [
    "wayland-backends",
    "dep:gbm",
    "dep:winit",
    "dep:x11rb",
    "smithay/backend_winit",
    "smithay/backend_x11",
]

[[bin]]
name = "jwm-tool"
path = "tools/jwm_tool.rs"

[[bin]]
name = "jwm-support"
path = "tools/jwm_support.rs"

[dependencies]
clap = { version = "4.6.2", features = ["derive", "env"] }
dirs = "6.0.0"
glob = "0.3.3"
signal-hook = "0.4.4"
slotmap = { version = "1.1.1", features = ["serde"] }
x11 = { version = "2.21.0", features = ["glx", "xlib", "xlib_xcb", "xcursor", "xfixes", "xinput", "xrandr", "xrender", "dpms", "xf86vmode"], optional = true }
x11rb = { version = "0.14.0", features = ["all-extensions", "allow-unsafe-code"], optional = true }
x11rb-protocol = { version = "0.14.0", features = ["present"], optional = true }

libc = "0.2.186"
notify = "8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
chrono = "0.4.45"
log = "0.4.33"
toml = "1.1.3"
# Protocol single entry point: shared_structures is consumed only through
# xbar_core's re-export, and both live in this tree — the working tree IS the
# protocol revision for jwm and every bar.
xbar_core = { path = "crates/xbar_core", features = ["logging-flexi", "transport-shared"] }
nix = { version = "0.31.3", features = ["signal", "inotify", "fs", "poll"] }
lazy_static = "1.5.0"
arc-swap = "1"
alsa = { version = "0.12", optional = true }
ab_glyph = "0.2.32"
rand = "0.10.2"
xkbcommon = "0.9.0"
bitflags = "2.13.1"
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "e76f1af1418e9cdf012da9020c2f1ecc0fe020fa", default-features = false, optional = true, features = [
"use_system_lib",
"wayland-backend",
"wayland_frontend",
"backend_egl",
"renderer_gl",
"desktop",
"xwayland",
] }
calloop = { version = "0.14.4", features = ["signals"] }
glow = "0.18"
winit = { version = "0.30.13", optional = true }
png = "0.18"
image = "0.25"
xcursor = "0.3.10"
tracing = "0.1.44"
drm = { version = "0.15.0", optional = true }
drm-ffi = { version = "0.9.1", optional = true }
libseat = { version = "0.2.4", optional = true }
gbm = { version = "0.18.0", optional = true }
egl = { version = "0.2.7", optional = true }
xcb = { version = "1.7.0", features = ["composite", "shape", "randr", "damage", "present", "xfixes", "screensaver"], optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "wm_benchmark"
harness = false

# Reference-only release tuning (INTENTIONALLY DISABLED).
#
# IMPORTANT: Keep this entire [profile.release] block commented out. The project
# maintainer deliberately does not enable these settings by default. Do not turn
# them on as part of routine cleanup or generic performance work. Any activation
# must be a dedicated change with explicit maintainer approval, benchmark data,
# build-time impact, and crash/diagnostics review.
# [profile.release]
# opt-level = 3
# lto = "thin"
# codegen-units = 1
# panic = "unwind"
# strip = "symbols"
# incremental = false

# Profiling build: release-grade codegen but keeps symbols and skips strip so
# samply/perf can resolve frames. Use: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
