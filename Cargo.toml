[package]
name = "x11rb_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
x11rb = { version = "0.13.2", features = ["all-extensions", "allow-unsafe-code", "dl-libxcb", "extra-traits"] }
anyhow = "1.0.103"
xbar_core = { git = "https://github.com/beamiter/xbar_core.git", tag = "v0.8.0", default-features = false, features = [
    "clock-chrono",
    "config-toml",
    "logging-flexi",
    "provider-alsa",
    "provider-battery-sysfs",
    "provider-brightnessctl",
    "provider-network-sysfs",
    "provider-system",
    "render-cairo",
    "runtime-linux",
    "transport-shared",
] }
xbar_linux_actions = { git = "https://github.com/beamiter/xbar_core.git", tag = "v0.8.0" }
libc = "0.2.186"
log = "0.4.33"
cairo-rs = { version = "0.22.0", features = ["xcb"] }
pango = "0.22.8"

xcb = "1.7.0"
