[package]
name = "tauri_svelte_bar"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.5.0"
log = "0.4.28"
xbar_core = { path = "../../../crates/xbar_core", default-features = false, features = ["logging-flexi"] }
xbar_tauri = { path = "../../../crates/xbar_core/crates/xbar_tauri", features = ["clock-chrono", "provider-alsa", "provider-battery-sysfs", "provider-brightnessctl", "provider-network-sysfs", "provider-system"] }
