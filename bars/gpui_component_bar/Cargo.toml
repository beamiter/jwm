[package]
name = "gpui_component_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# gpui-component 0.8.1 uses this exact GPUI snapshot. Keep the framework and
# native platform aligned so component elements share the same GPUI types.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["wayland", "x11"] }
gpui-component = "=0.8.1"
log = "0.4"
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = ["clock-chrono", "config-toml", "glass", "logging-flexi", "provider-alsa", "provider-battery-sysfs", "provider-brightnessctl", "provider-network-sysfs", "provider-system", "transport-shared"] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }
# Match GPUI's graphics stack for the transient ARGB capability probe.
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "dl-libxcb"] }
wgpu = "30.0.1"
raw-window-handle = "0.6"
pollster = "0.4"
