[package]
name = "iced_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
# `lazy` was removed upstream on iced master; the bar never used Lazy widgets.
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master", features = ["advanced", "debug", "smol"] }
log = "0.4.34"
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = ["clock-chrono", "config-toml", "glass", "logging-flexi", "provider-alsa", "provider-battery-sysfs", "provider-brightnessctl", "provider-network-sysfs", "provider-system", "transport-shared"] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }
anyhow = "1.0.104"
futures-lite = "2"
raw-window-handle = "0.6"
wgpu = "30"
x11rb = { version = "0.14", features = ["allow-unsafe-code", "dl-libxcb"] }
