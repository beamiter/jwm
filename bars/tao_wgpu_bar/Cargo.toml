[package]
name = "tao_wgpu_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.189"
log = "0.4.33"
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = [
    "clock-chrono",
    "config-toml",
    "glass",
    "logging-flexi",
    "provider-alsa",
    "provider-battery-sysfs",
    "provider-brightnessctl",
    "provider-network-sysfs",
    "provider-system",
    "render-cairo",
    "runtime-linux",
    "transport-shared",
] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }
xbar_present_wgpu = { path = "../../crates/xbar_core/crates/xbar_present_wgpu" }
cairo-rs = "0.22.0"
pango = "0.22.8"
raw-window-handle = "0.6.2"
tao = "0.36.0"
x11rb = "0.14"
