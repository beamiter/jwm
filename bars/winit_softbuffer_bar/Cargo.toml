[package]
name = "winit_softbuffer_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.189"
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = [
    "clock-chrono",
    "config-toml",
    "glass",
    "logging-flexi",
    "provider-alsa",
    "provider-battery-sysfs",
    "provider-brightnessctl",
    "provider-network-sysfs",
    "provider-system",
    "render-cairo",
    "runtime-linux",
    "transport-shared",
] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }
softbuffer = "0.4.8"
pango = "0.22.9"
cairo-rs = "0.22.9"
log = "0.4.34"
winit = "0.30.13"
anyhow = "1.0.104"
bytemuck = "1.25.2"
x11rb = "0.14"
raw-window-handle = "0.6"
