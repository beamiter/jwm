[package]
name = "gpui_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
# gpui is not on crates.io — pull from the zed monorepo.
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland", "x11"] }

log = "0.4"
anyhow = "1"
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = ["clock-chrono", "config-toml", "glass", "logging-flexi", "provider-alsa", "provider-battery-sysfs", "provider-brightnessctl", "provider-network-sysfs", "provider-system", "transport-shared"] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }
# The startup probe that decides translucent vs solid: one throwaway XCB
# window and a wgpu surface-capabilities query, asked and torn down before
# gpui owns the display. Versions match this bar's existing lock (wgpu 29.x,
# x11rb 0.13.2, pollster 0.4) so none of them compile twice.
x11rb = { version = "0.13", features = ["allow-unsafe-code", "dl-libxcb"] }
wgpu = "29"
raw-window-handle = "0.6"
pollster = "0.4"

# Linux-only offline build: gpui pins exact macOS-only versions that aren't in
# the local cargo cache. These crates are gated on `cfg(target_os = "macos")`
# in gpui itself, so on Linux nothing is ever compiled from them — they only
# need to resolve. Swap them for empty local stubs at the pinned versions.
[patch.crates-io]
cocoa = { path = "vendor/cocoa-stub" }
cocoa-foundation = { path = "vendor/cocoa-foundation-stub" }
core-foundation = { path = "vendor/core-foundation-stub" }
