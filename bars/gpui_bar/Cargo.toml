[package]
name = "gpui_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
# Standalone registry snapshots of GPUI and its native platform, without a
# checkout of the Zed editor monorepo. Keep both on the same exact snapshot as
# gpui_component_bar so the shared sidebar uses one framework API.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["wayland", "x11"] }

log = "0.4"
# zune-core 0.5.2's no-log macros expand to no tokens, while zune-jpeg 0.5.15
# uses `warn!` as a branch expression. Enable its supported logging path so the
# transitive image decoder uses expression-safe macros.
zune-jpeg = { version = "0.5", default-features = false, features = ["log"] }
anyhow = "1"
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = ["clock-chrono", "config-toml", "glass", "logging-flexi", "provider-alsa", "provider-battery-sysfs", "provider-brightnessctl", "provider-network-sysfs", "provider-system", "transport-shared"] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }
# The startup probe that decides translucent vs solid: one throwaway XCB
# window and a wgpu surface-capabilities query, asked and torn down before
# gpui owns the display. Match the selected GPUI snapshot's dependency lines
# so the probe shares its wgpu, x11rb and pollster instead of building a second
# graphics stack. Update these alongside GPUI; see README.md.
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "dl-libxcb"] }
wgpu = "29.0.4"
raw-window-handle = "0.6"
pollster = "0.4"
