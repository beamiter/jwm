[package]
name = "xcb_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = [
    "clock-chrono",
    "config-toml",
    "logging-flexi",
    "provider-alsa",
    "provider-battery-sysfs",
    "provider-brightnessctl",
    "provider-network-sysfs",
    "provider-system",
    "render-cairo",
    "runtime-linux",
    "transport-shared",
] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }
libc = "0.2.186"
log = "0.4.33"
cairo-rs = { version = "0.22.0", features = ["xcb"] }
pango = "0.22.8"

xcb = "1.7.0"

