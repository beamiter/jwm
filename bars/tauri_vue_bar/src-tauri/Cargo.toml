[package]
name = "tauri_vue_bar"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "tauri_vue_bar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-opener = "2.5.4"

log = "0.4.32"
xbar_core = { path = "../../../crates/xbar_core", default-features = false, features = ["logging-flexi"] }
xbar_tauri = { path = "../../../crates/xbar_core/crates/xbar_tauri", features = ["clock-chrono", "provider-alsa", "provider-battery-sysfs", "provider-brightnessctl", "provider-network-sysfs", "provider-system"] }
