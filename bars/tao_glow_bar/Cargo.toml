[package]
name = "tao_glow_bar"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
cairo-rs = "0.22.9"
glow = "0.18.0"
glutin = "0.32.3"
gtk = "0.18.2"
log = "0.4.34"
libc = "0.2"
jwm_ipc_transport = { path = "../../crates/jwm_ipc_transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pango = "0.22.9"
pangocairo = "0.22.9"
raw-window-handle = "0.6"
softbuffer = "0.4.8"
tao = "0.37.0"
x11rb = { version = "0.14", features = ["shape"] }
xbar_core = { path = "../../crates/xbar_core", default-features = false, features = [
    "clock-chrono",
    "config-toml",
    "glass",
    "glass-wallpaper",
    "logging-flexi",
    "provider-alsa",
    "provider-battery-sysfs",
    "provider-brightnessctl",
    "provider-network-sysfs",
    "provider-system",
    "render-cairo",
    "runtime-linux",
    "transport-shared",
] }
xbar_linux_actions = { path = "../../crates/xbar_core/crates/xbar_linux_actions" }

# GTK3 compatibility: upstream RUSTSEC-2024-0429 fix, see vendor/glib/JWM-BACKPORT.md.
[patch.crates-io]
glib = { path = "../../vendor/glib" }
