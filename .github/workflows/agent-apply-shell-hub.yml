name: Apply Quickshell-inspired JWM Shell Hub

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/quickshell-inspired-shell-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply generated implementation
        run: |
          base64 --decode .github/agent-shell-hub.py.gz.b64 | gzip --decompress > .github/agent-shell-hub.py
          python3 .github/agent-shell-hub.py
          cargo fmt --all

      - name: Run Shell Hub tests
        run: cargo test --locked --lib --no-default-features shell_hub -- --nocapture

      - name: Run control-center regression tests
        run: cargo test --locked --lib --no-default-features control_center -- --nocapture

      - name: Check library
        run: cargo check --locked --lib --no-default-features

      - name: Commit implementation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/agent-shell-hub.py.gz.b64
          rm .github/agent-shell-hub.py
          rm .github/workflows/agent-apply-shell-hub.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs .github
          git commit -m "feat(shell): add Quickshell-inspired Shell Hub [agent-applied]"
          git push origin "HEAD:${HEAD_BRANCH}"
