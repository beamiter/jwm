          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          p = Path(os.environ["JWM_REMOTE_LATENCY_REPORT"])
          assert p.is_file() and 0 < p.stat().st_size <= 1048576
          r = json.loads(p.read_text())
          assert r["schema_version"] == 3 and r["success"] is True
          assert r["benchmark"] == "proof_delta_abba"
          assert r["order"] == ["Alegacy", "Blegacy", "Anew", "Bnew", "Bnew", "Anew", "Blegacy", "Alegacy"]
          assert len(r["sessions"]) == 8 and r["comparison"] is not None
          expected = [(True, False), (False, False), (True, True), (False, True), (False, True), (True, True), (False, False), (True, False)]
          assert [(s["legacy_forced_keyframe"], s["ack_wake_enabled"]) for s in r["sessions"]] == expected
          assert all(s["retained_proof_slots_legacy"] is (not s["ack_wake_enabled"]) for s in r["sessions"])
          assert len(r["groups"]) == 2 and all(g["comparison"] is not None for g in r["groups"])
          assert r["four_configuration_summary"] is not None
          for session in r["sessions"]:
              assert session["success"] is True
              samples = session["samples"]
              assert len(samples) == 18 and all(s["status"] == "ok" for s in samples)
              assert all(s["inject_to_client_ready_ms"] >= s["inject_to_present_observed_ms"] for s in samples)
              assert sum(s["phase"] == "warmup" for s in samples) == 2
              assert sum(s["phase"] == "measured" for s in samples) == 16
              assert len(session["checks"]) == 2 and all(c["status"] == "ok" for c in session["checks"])
          for index in range(18):
              assert len({s["samples"][index]["source_rgb_sha256"] for s in r["sessions"]}) == 1
          print("Validated symmetric proof/ACK-wake comparison: 144 equal-input samples plus static/full-change controls")
          PYREPORT
      - name: Preserve bounded controlled input response evidence
        if: always()
