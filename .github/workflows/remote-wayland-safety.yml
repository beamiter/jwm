name: Remote Wayland source safety

on:
  push:
    branches: [master, dot/remote-window-plan]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-wayland-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surface-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      JWM_REQUIRE_HEADLESS_GL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install native build and software renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libudev-dev libinput-dev libseat-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libegl-mesa0 libgl1-mesa-dri xvfb xauth libx11-dev libx11-xcb-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-screensaver0-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Format and lint native source plus compositor
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib --bin jwm-remote --tests --no-deps -- -D warnings
      - name: Compile nested Wayland input revocation paths
        run: cargo check --locked --no-default-features --features remote-wayland,backend-wayland-nested --lib
      - name: KMS contracts, presentation ownership and VT generation regressions
        run: |
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib backend::wayland_udev::backend::kms::
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib presentation_generation_tests::
      - name: Actual FBO sampling provenance and callback isolation
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib fbo_provenance -- --test-threads=1 --nocapture
      - name: Explicit read-only resize-follow layout and pixel safety
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib image_copy_capture::resize_tests -- --test-threads=1 --nocapture
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib host_resize_integration -- --test-threads=1 --nocapture
      - name: Explicit read-only popup capture isolation
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib image_copy_capture::popup_tests -- --test-threads=1 --nocapture
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib host_popup_integration -- --test-threads=1 --nocapture
      - name: Actual scoped keyboard lease recipient and revocation tests
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib remote_keyboard -- --test-threads=1 --nocapture
      - name: Actual scoped pointer recipients, fresh-frame coordinates and revocation
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib remote_pointer -- --test-threads=1 --nocapture
      - name: Actual unified control recipients and shared lease revocation
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib remote_control -- --test-threads=1 --nocapture
      - name: Actual Wayland protocol authority and offscreen pixel isolation
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib image_copy_capture -- --test-threads=1 --nocapture
      - name: Actual viewer XKB identity and restored-map history guard
        run: |
          python3 scripts/test-remote-keyboard-keymap.py --self-test
          python3 scripts/test-remote-keyboard-keymap.py
      - name: Native Wayland read-only viewer protocol and pixel contract
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib remote::host::wayland_viewer_integration -- --test-threads=1 --nocapture
      - name: Controlled input to unique visible marker benchmark
        timeout-minutes: 3
        env:
          JWM_REMOTE_LATENCY_REPORT: ${{ runner.temp }}/remote-input-response.json
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib remote::host::wayland_viewer_integration::host_control_integration::latency_benchmark::controlled_input_to_unique_visible_marker_latency -- --ignored --exact --nocapture --test-threads=1 2>&1 | tail -c 1048576 | tee "${{ runner.temp }}/remote-input-response.log"
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          path = Path(os.environ["JWM_REMOTE_LATENCY_REPORT"])
          assert path.is_file() and 0 < path.stat().st_size <= 1048576, "missing, empty or oversized benchmark report"
          report = json.loads(path.read_text())
          assert report["schema_version"] == 1 and report["success"] is True
          assert report["warmup_requested"] == 2 and report["measured_requested"] == 16
          samples = report["samples"]
          assert len(samples) == 18 and all(s["status"] == "ok" for s in samples)
          assert sum(s["phase"] == "warmup" for s in samples) == 2
          assert sum(s["phase"] == "measured" for s in samples) == 16
          print("Validated complete 2-warmup / 16-measured response benchmark report")
          PYREPORT
      - name: Same-process retained-frame scheduling A/B evidence
        timeout-minutes: 4
        env:
          JWM_REMOTE_LATENCY_REPORT: ${{ runner.temp }}/remote-input-response-ab.json
        run: |
          set -o pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib remote::host::wayland_viewer_integration::host_control_integration::latency_benchmark::controlled_input_to_unique_visible_marker_latency_abba -- --ignored --exact --nocapture --test-threads=1 2>&1 | tail -c 1048576 | tee "${{ runner.temp }}/remote-input-response-ab.log"
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          path = Path(os.environ["JWM_REMOTE_LATENCY_REPORT"])
          assert path.is_file() and 0 < path.stat().st_size <= 1048576
          report = json.loads(path.read_text())
          assert report["schema_version"] == 1 and report["success"] is True
          assert report["benchmark"] == "retained_frame_schedule_abba"
          assert report["order"] == ["A_legacy", "B_candidate", "B_candidate", "A_legacy"]
          assert len(report["sessions"]) == 4
          for session in report["sessions"]:
              assert session["success"] is True
              assert session["warmup_requested"] == 2 and session["measured_requested"] == 16
              samples = session["samples"]
              assert len(samples) == 18 and all(s["status"] == "ok" for s in samples)
              assert sum(s["phase"] == "warmup" for s in samples) == 2
              assert sum(s["phase"] == "measured" for s in samples) == 16
          assert report["comparison"] is not None
          print("Validated complete same-process A/B/B/A: 72 samples, 64 measured")
          PYREPORT
      - name: Preserve bounded controlled input response evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remote-input-response-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/remote-input-response.json
            ${{ runner.temp }}/remote-input-response.log
            ${{ runner.temp }}/remote-input-response-ab.json
            ${{ runner.temp }}/remote-input-response-ab.log
          if-no-files-found: warn
          retention-days: 3
      - name: Actual owned X11 viewer presentation and scoped pointer interaction
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          python3 scripts/test-remote-viewer-e2e.py --self-test
          python3 scripts/test-remote-viewer-e2e.py
      - name: Offline software codec evidence self-tests
        run: |
          python3 scripts/benchmark-software-h264.py --self-test
          python3 scripts/remote-codec-rate-distortion.py --self-test
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib tile_scroll_copy_offline_ab_benchmark -- --ignored --nocapture --test-threads=1
      - name: Native source adapter, transport, and CLI regressions
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib remote:: -- --nocapture
          cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --bin jwm-remote
