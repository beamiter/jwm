name: WaterLily compositor validation

on:
  push:
    paths:
      - src/backend/api.rs
      - src/backend/compositor_common/waterlily.rs
      - src/backend/x11/compositor/**
      - src/backend/x11rb/backend.rs
      - src/backend/xcb/backend.rs
      - src/config.rs
      - src/ipc.rs
      - src/jwm.rs
      - src/jwm/features/toggles.rs
      - waterlily/**
      - tools/validate_waterlily_shaders.py
      - docs/waterlily.md
      - .github/workflows/waterlily-integration.yml
  pull_request:
    branches:
      - master
    paths:
      - src/backend/api.rs
      - src/backend/compositor_common/waterlily.rs
      - src/backend/x11/compositor/**
      - src/backend/x11rb/backend.rs
      - src/backend/xcb/backend.rs
      - src/config.rs
      - src/ipc.rs
      - src/jwm.rs
      - src/jwm/features/toggles.rs
      - waterlily/**
      - tools/validate_waterlily_shaders.py
      - docs/waterlily.md
      - .github/workflows/waterlily-integration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waterlily-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            glslang-tools \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxxf86vm-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt

      - name: Install the locked Julia version
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: "1.12.6"

      - name: Cache Julia packages
        uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
        with:
          delete-old-caches: "false"

      - name: Check WaterLily integration formatting
        run: cargo fmt --all -- --check

      - name: Check shader validator
        run: python3 -m py_compile tools/validate_waterlily_shaders.py

      - name: Compile embedded WaterLily postprocess shader
        run: python3 tools/validate_waterlily_shaders.py

      - name: Parse Julia worker sources
        run: |
          mapfile -t julia_sources < <(find waterlily -type f -name '*.jl' -print)
          julia --startup-file=no -e \
            'foreach(path -> Meta.parseall(read(path, String)), ARGS)' \
            "${julia_sources[@]}"

      - name: Test Julia WaterLily worker
        env:
          JULIA_NUM_THREADS: auto
        run: |
          set -euo pipefail
          test -f waterlily/Manifest.toml
          julia --startup-file=no --project=waterlily -e \
            'using Pkg; Pkg.instantiate(); Pkg.test(; allow_reresolve=false)'
          git diff --exit-code -- \
            waterlily/Project.toml waterlily/Manifest.toml

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run WaterLily state tests
        run: cargo test --locked --lib waterlily

  julia-1-10-compat:
    name: Julia 1.10 compatibility canary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact Julia 1.10
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32  # v3.0.2
        with:
          version: "1.10.12"

      - name: Cache Julia packages
        uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8  # v3.3.0
        with:
          delete-old-caches: "false"

      # This canary intentionally resolves from Project.toml on the declared
      # compatibility floor. The primary job remains locked to Julia 1.12.6.
      - name: Resolve and test the compatibility floor in a temporary copy
        env:
          JULIA_NUM_THREADS: auto
        shell: bash
        run: |
          set -euo pipefail
          compat_project="$RUNNER_TEMP/waterlily-julia-1.10"
          cp -R waterlily "$compat_project"
          rm -f -- "$compat_project/Manifest.toml"
          julia --startup-file=no --project="$compat_project" -e \
            'using Pkg; Pkg.resolve(); Pkg.instantiate(); Pkg.test()'
          git diff --exit-code -- \
            waterlily/Project.toml waterlily/Manifest.toml
