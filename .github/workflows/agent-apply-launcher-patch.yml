name: Apply launcher composite command patch

on:
  push:
    branches:
      - agent/launcher-composite-commands
    paths:
      - .github/agent-launcher-composite.patch
      - .github/workflows/agent-apply-launcher-patch.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply patch
        run: |
          git apply --check .github/agent-launcher-composite.patch
          git apply .github/agent-launcher-composite.patch
          cargo fmt --all

      - name: Run focused launcher tests
        run: cargo test --locked --lib --no-default-features launcher_ -- --nocapture

      - name: Commit implementation
        run: |
          rm .github/agent-launcher-composite.patch
          rm .github/workflows/agent-apply-launcher-patch.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jwm/features/system_ui.rs .github
          git commit -m "feat(launcher): support composite commands [agent-applied]"
          git push origin HEAD:${{ github.ref_name }}
