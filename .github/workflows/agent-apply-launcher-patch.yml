name: Apply launcher composite command patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/launcher-composite-commands'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply patch
        run: |
          git apply --check .github/agent-launcher-composite.patch
          git apply .github/agent-launcher-composite.patch
          cargo fmt --all

      - name: Run focused launcher tests
        run: cargo test --locked --lib --no-default-features launcher_ -- --nocapture

      - name: Commit implementation
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/agent-launcher-composite.patch
          rm .github/workflows/agent-apply-launcher-patch.yml
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jwm/features/system_ui.rs .github
          git commit -m "feat(launcher): support composite commands [agent-applied]"
          git push origin "HEAD:${HEAD_BRANCH}"
