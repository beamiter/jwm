name: Desktop visual extension contract

on:
  push:
    paths:
      - crates/desktop_visual/**
      - extensions/desktop_visual/**
      - src/backend/x11/compositor/desktop_visual.rs
      - src/backend/x11/compositor/render.rs
      - src/backend/x11/compositor/config.rs
      - src/backend/x11/compositor/init.rs
      - scripts/test-desktop-visual-gl.py
      - .github/workflows/desktop-visual.yml
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - crates/desktop_visual/**
      - extensions/desktop_visual/**
      - src/backend/x11/compositor/desktop_visual.rs
      - src/backend/x11/compositor/render.rs
      - src/backend/x11/compositor/config.rs
      - src/backend/x11/compositor/init.rs
      - scripts/test-desktop-visual-gl.py
      - .github/workflows/desktop-visual.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-producers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - name: Test bounded transport, including real private Unix sockets
        run: |
          cargo test --locked -p desktop_visual --all-targets
          cargo clippy --locked -p desktop_visual --all-targets --no-deps -- -D warnings
          cargo fmt --all -- --check
      - name: Test unrelated Python producer, native IPC and lifecycle
        run: python3 -m unittest discover -s extensions/desktop_visual -p 'test_*.py' -v
      - name: Install software EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri
      - name: Verify production GLSL alpha, scaling and coordinates
        run: python3 scripts/test-desktop-visual-gl.py
