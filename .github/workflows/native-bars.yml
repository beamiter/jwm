name: Native bar validation

on:
  push:
    branches:
      - master
    paths:
      - bars/tao_pixels_bar/**
      - bars/tao_softbuffer_bar/**
      - bars/tao_wgpu_bar/**
      - bars/winit_pixels_bar/**
      - bars/winit_softbuffer_bar/**
      - bars/winit_wgpu_bar/**
      - crates/shared_structures/**
      - crates/xbar_core/**
      - rust-toolchain.toml
      - .github/workflows/native-bars.yml
  pull_request:
    branches:
      - master
    paths:
      - bars/tao_pixels_bar/**
      - bars/tao_softbuffer_bar/**
      - bars/tao_wgpu_bar/**
      - bars/winit_pixels_bar/**
      - bars/winit_softbuffer_bar/**
      - bars/winit_wgpu_bar/**
      - crates/shared_structures/**
      - crates/xbar_core/**
      - rust-toolchain.toml
      - .github/workflows/native-bars.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-bars-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-bars
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, check, and test six native presenters
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install native bar build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-bars

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          bars=(tao_pixels_bar tao_softbuffer_bar tao_wgpu_bar winit_pixels_bar winit_softbuffer_bar winit_wgpu_bar)
          for bar in "${bars[@]}"; do
            cargo fmt --manifest-path "bars/$bar/Cargo.toml" -- --check
          done

      - name: Check all targets
        shell: bash
        run: |
          set -euo pipefail
          # These isolated presenters intentionally ignore Cargo.lock, so a
          # clean checkout must resolve an ephemeral lock before compiling.
          bars=(tao_pixels_bar tao_softbuffer_bar tao_wgpu_bar winit_pixels_bar winit_softbuffer_bar winit_wgpu_bar)
          for bar in "${bars[@]}"; do
            cargo check --manifest-path "bars/$bar/Cargo.toml" --all-targets
          done

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          bars=(tao_pixels_bar tao_softbuffer_bar tao_wgpu_bar winit_pixels_bar winit_softbuffer_bar winit_wgpu_bar)
          for bar in "${bars[@]}"; do
            cargo test --manifest-path "bars/$bar/Cargo.toml" --all-targets
          done
