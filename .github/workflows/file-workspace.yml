name: File Workspace

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/file-workspace.yml'
      - 'crates/jwm_file_core/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/file-workspace.yml'
      - 'crates/jwm_file_core/**'

permissions:
  contents: read

jobs:
  local-provider:
    name: File Workspace local provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - name: Check and test the isolated core
        working-directory: crates/jwm_file_core
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
