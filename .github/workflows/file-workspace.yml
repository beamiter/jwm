name: File Workspace

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/file-workspace.yml'
      - 'crates/jwm_file_core/**'
      - 'crates/jwm_files/**'
      - 'crates/jwm_markdown/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/file-workspace.yml'
      - 'crates/jwm_file_core/**'
      - 'crates/jwm_files/**'
      - 'crates/jwm_markdown/**'

permissions:
  contents: read

jobs:
  local-provider:
    name: File Workspace local provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - name: Check and test the isolated core
        working-directory: crates/jwm_file_core
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  gtk-browser:
    name: File Workspace GTK4 browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.92.0'
          components: rustfmt, clippy
      - name: Check the shared Markdown renderer
        working-directory: crates/jwm_markdown
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Install GTK4 and private X11 test dependencies
        run: bash scripts/ci-install-deps.sh libgtk-4-dev xvfb xauth xdotool
      - name: Build and drive the native browser
        working-directory: crates/jwm_files
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp -noreset' \
            bash tests/x11-smoke.sh "$PWD/target/debug/jwm-files"
          GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp -noreset' \
            cargo test --locked native_tree_reads_independent_branches_and_activates_exact_paths -- --ignored --nocapture
          GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp -noreset' \
            cargo test --locked native_breadcrumb_clicks_use_exact_visible_and_overflow_paths -- --ignored --nocapture
      - name: Install the private OpenDirectory portal test dependencies
        run: bash scripts/ci-install-deps.sh xdg-desktop-portal xdg-desktop-portal-gtk desktop-file-utils
      - name: Drive the real OpenDirectory portal with Unix file descriptors
        working-directory: crates/jwm_files
        timeout-minutes: 3
        run: |
          broker=$(dpkg -L xdg-desktop-portal | grep -E '/(libexec|lib/xdg-desktop-portal)/xdg-desktop-portal$')
          test -x "$broker"
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp -noreset' \
            bash tests/portal-smoke.sh "$PWD/target/debug/jwm-files" "$broker"
      - name: Install the headless Wayland reference compositor
        run: bash scripts/ci-install-deps.sh weston
      - name: Verify native Wayland mapping and navigation
        working-directory: crates/jwm_files
        timeout-minutes: 3
        run: bash tests/wayland-smoke.sh
      - name: Exercise the opt-in UI benchmark in a private X11 window
        working-directory: crates/jwm_files
        timeout-minutes: 3
        run: |
          GDK_BACKEND=x11 GSK_RENDERER=cairo JWM_FILE_BENCH_SAMPLES=5 \
            xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' \
            cargo test --locked native_listing_benchmark -- --ignored --nocapture
