name: Recording mic fallback evidence (validation only)

on:
  push:
    branches: [validate/recording-mic-fallback-f069557]
    paths: [.github/workflows/recording-mic-fallback-evidence.yml]

permissions:
  contents: read

jobs:
  encoder-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: "1"
      JWM_REQUIRE_HEADLESS_GL: "1"
    steps:
      - name: Check out the reviewed combined commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f069557ad623a3b1a9d21934450ca5eb8a30598b
          persist-credentials: false
      - name: Verify the test input
        run: |
          test "$(git rev-parse HEAD)" = "f069557ad623a3b1a9d21934450ca5eb8a30598b"
          test "$(git rev-parse HEAD^{tree})" = "e2c5eb03ffb0e1d2d8d3b75b462ada48daf053ec"
          printf 'Testing combined commit %s\n' "$(git rev-parse HEAD)"
      - name: Install Wayland software rendering and media fixtures
        timeout-minutes: 15
        run: |
          bash scripts/ci-install-deps.sh build-essential pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libasound2-dev libdbus-1-dev libudev-dev libinput-dev libseat-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev ffmpeg
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Exercise the real encoder and verify the two synthetic clips
        shell: bash
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          cargo test --locked -p jwm --lib --no-default-features --features backend-wayland-udev \
            'backend::wayland_udev::compositor::recording::tests::a_missing_requested_mic_keeps_a_video_track_and_marks_only_that_session' -- --exact --nocapture 2>&1 | tee "$log"
          grep -F 'test backend::wayland_udev::compositor::recording::tests::a_missing_requested_mic_keeps_a_video_track_and_marks_only_that_session ... ok' "$log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$log"
          if grep -Fq 'skipping recording encoder integration' "$log"; then exit 1; fi
