name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint executable Bash scripts
        run: bash scripts/lint-shell.sh

      - name: Exercise offline updater contracts
        run: bash scripts/test-git-update-all.sh

      - name: Exercise release install lifecycle
        run: bash scripts/test-install-lifecycle.sh

      - name: Exercise offline metrics-tool contracts
        run: bash scripts/test-metrics-tools.sh

  check-and-test:
    name: Check, Clippy, and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxxf86vm-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            xauth \
            xvfb

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --lib --bins --tests --no-deps -- -D warnings

      - name: Run tests
        run: cargo test --locked --lib --bins --tests
        env:
          EGL_PLATFORM: surfaceless
          JWM_REQUIRE_HEADLESS_GL: 1

      - name: Run native X11 clipboard contracts
        run: |
          timeout 90s xvfb-run -a cargo test --locked --lib \
            'backend::clipboard_x11::tests::native_' -- \
            --ignored --test-threads=1
          timeout 90s xvfb-run -a cargo test --locked --lib \
            'backend::xcb::clipboard::tests::native_' -- \
            --ignored --test-threads=1

  feature-profiles:
    name: Feature profile (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: x11rb
            features: backend-x11rb
          - name: xcb
            features: backend-xcb
          - name: remote-x11
            features: remote-x11
          - name: xcb-remote
            features: backend-xcb,remote-x11
          - name: wayland-udev
            features: backend-wayland-udev
          - name: wayland-nested
            features: backend-wayland-nested
          - name: no-backends
            features: ""
          - name: all-backends-no-media
            features: backend-x11rb,backend-xcb,backend-wayland-udev,backend-wayland-nested,alloc-counter
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxxf86vm-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: profile-${{ matrix.profile.name }}

      - name: Check all targets without default backends
        run: >
          cargo check --locked --all-targets --no-default-features
          ${{ matrix.profile.features != '' && format('--features {0}', matrix.profile.features) || '' }}

  portal:
    name: Portal (xdg-desktop-portal ScreenCast backend)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            meson \
            ninja-build \
            clang \
            libclang-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libdrm-dev \
            libgbm-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: portal

      - name: Cache the PipeWire prefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/jwm/pipewire-prefix
          key: pipewire-prefix-${{ runner.os }}-1.2.7

      - name: Ensure PipeWire >= 1.2 development metadata
        run: bash scripts/ensure_pipewire.sh --env >> "$GITHUB_ENV"

      - name: Check the portal crate
        working-directory: portal
        run: cargo check --locked --all-targets

  bridge:
    name: Bridge (freedesktop notifications and MPRIS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # zbus speaks the D-Bus wire protocol over a socket, so unlike the
      # portal this crate needs no system libraries beyond the toolchain.
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: bridge

      # Keep an explicit bridge gate because this service has a much smaller
      # dependency and runtime surface than the compositor, even though it is
      # now also a root-workspace member.
      - name: Check formatting
        working-directory: bridge
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: bridge
        run: cargo clippy --locked --all-targets --no-deps

      - name: Test
        working-directory: bridge
        run: cargo test --locked --all-targets

  video-demo:
    name: Video demo (Rust, Python, and shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt,clippy

      - name: Cache demo-client build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: video-demo-client
          workspaces: video-demo/demo-client -> target

      # actions/setup-python v7.0.0
      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install shell test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check demo-client formatting
        run: >-
          cargo fmt --manifest-path video-demo/demo-client/Cargo.toml
          --all -- --check

      - name: Lint demo-client
        run: >-
          cargo clippy --manifest-path video-demo/demo-client/Cargo.toml
          --all-targets --locked -- -D warnings

      - name: Test demo-client
        run: >-
          cargo test --manifest-path video-demo/demo-client/Cargo.toml
          --all-targets --locked

      - name: Test the Python runner
        working-directory: video-demo
        run: python -m unittest discover -s tests -v

      - name: Lint session recovery script
        run: |
          bash -n video-demo/scripts/recover-session.sh
          shellcheck video-demo/scripts/recover-session.sh

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxxf86vm-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev

      # The MSRV documented in Cargo.toml (rust-version). rust-toolchain.toml
      # pins the developer channel to stable, so the explicit `+1.89.0`
      # override is required here.
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: "1.89.0"

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Check all targets on the MSRV
        run: cargo +1.89.0 check --locked --all-targets
