name: CI

on:
  push:
    branches:
      - master
      - dot/remote-window-plan
      - dot/remote-readback-snapshot
      - dot/remote-popup-v2
      - dot/remote-popup-adapter
      - dot/remote-popup-action
      - dot/remote-popup-network
      - dot/remote-popup-cancel
      - dot/remote-popup-terminal
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native-apps:
    name: Native applications (Cairo/Pango)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test native-window harness without a display
        run: /usr/bin/python3 scripts/test-native-apps-harness.py -v
      - name: Install Cairo/Pango and isolated UI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev libglib2.0-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 pkg-config \
            xvfb xdotool x11-utils imagemagick python3-pil dbus-x11 fonts-noto-cjk sway wtype grim
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy,rustfmt
      - name: Cache native application build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: crates/jwm_apps -> ../../target/native-apps
      - name: Format, lint and test
        run: |
          cargo fmt --manifest-path crates/jwm_apps/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/jwm_apps/Cargo.toml --target-dir target/native-apps --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/jwm_apps/Cargo.toml --target-dir target/native-apps
          cargo build --locked --manifest-path crates/jwm_apps/Cargo.toml --target-dir target/native-apps
      - name: Exercise native Cairo windows on a private display
        run: /usr/bin/python3 scripts/test-native-apps.py --evidence-dir artifacts/native-apps
      - name: Exercise native live theme inheritance on a private IPC endpoint
        run: /usr/bin/python3 scripts/test-native-app-theme.py --evidence-dir artifacts/native-app-theme
      - name: Exercise native Wayland input and software surfaces at 1x and 2x
        run: |
          for scale in 1 2; do
            /usr/bin/python3 scripts/test-native-apps-wayland.py --scale "$scale" --evidence-dir artifacts/native-apps
          done
      - name: Upload native application failure evidence
        if: failure()
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-apps-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/native-apps/*.png
            artifacts/native-apps/*.log
            artifacts/native-app-theme/*.png
            artifacts/native-app-theme/*.log
          if-no-files-found: warn
          retention-days: 7
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq shellcheck libglib2.0-bin xdg-utils pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint executable Bash scripts
        run: bash scripts/lint-shell.sh

      - name: Exercise offline updater contracts
        run: |
          bash scripts/test-git-update-all.sh
          python3 scripts/test-git-update-all-install.py

      - name: Exercise release install lifecycle
        run: bash scripts/test-install-lifecycle.sh

      - name: Exercise source installer build recovery
        run: |
          run_step() {
            echo "::group::$*"
            if "$@"; then
              echo "::endgroup::"
            else
              local status=$?
              echo "::endgroup::"
              echo "::error::Installer recovery substep failed ($status): $*"
              return "$status"
            fi
          }
          run_step bash scripts/test-install-jwm-build.sh
          run_step bash scripts/test-tauri-webkit-version.sh
          run_step python3 scripts/test-media-defaults.py
          run_step bash scripts/test-wallpaper-install.sh
          run_step bash scripts/test-install-portal.sh
          run_step bash scripts/test-ensure-pipewire.sh
          run_step bash scripts/test-runtime-helpers.sh
          run_step bash scripts/test-bootstrap-deps.sh
          run_step python3 scripts/test-release-install-failures.py
          run_step python3 scripts/test-showcase-lifecycle.py
          run_step python3 scripts/test-collector.py
          run_step python3 scripts/test-installer-config.py
          run_step python3 scripts/test-remote-fault-proxy.py
          run_step python3 scripts/test-remote-benchmark-metadata.py
          run_step python3 scripts/test-install-config-update.py
          run_step python3 scripts/test-compositor-init-lifecycle.py
          run_step python3 scripts/test-acceptance-evidence.py
          run_step python3 scripts/test-frontend-theme-defaults.py
          run_step python3 scripts/test-display-preview.py

      - name: Exercise video automation contracts without a desktop
        run: PYTHONPATH=video-demo python3 -m unittest discover -s video-demo/tests -v

      - name: Exercise offline metrics-tool contracts
        run: bash scripts/test-metrics-tools.sh

      - name: Exercise test-wrapper process boundaries
        run: bash scripts/test-test-wrapper.sh

  check-and-test:
    name: Check, Clippy, and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxxf86vm-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            xauth \
            xwayland \
            xserver-xephyr \
            xdotool \
            x11-apps \
            x11-utils \
            python3-pil imagemagick \
            dbus-daemon \
            xvfb

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --lib --bins --tests --no-deps -- -D warnings

      - name: Run tests
        run: cargo test --locked --lib --bins --tests
        env:
          EGL_PLATFORM: surfaceless
          JWM_REQUIRE_HEADLESS_GL: 1

      - name: Procedural wallpaper cache GL/GLES regression
        run: bash scripts/test-procedural-wallpaper-cache.sh
        env:
          JWM_REQUIRE_HEADLESS_GL: 1

      - name: DVR X11 GL and native Wayland GLES shader regressions
        run: |
          python3 scripts/test-desktop-visual-gl.py
          JWM_DVR_GL_BACKEND=wayland python3 scripts/test-desktop-visual-gl.py
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          EGL_PLATFORM: surfaceless

      - name: Native wallpaper and real X11 restart ownership regression
        run: |
          cargo build --locked -p jwm --bin jwm --bin jwm-tool
          python3 scripts/test-restart-x11.py --jwm target/debug/jwm --compositor both --triggers hotkey,ipc --stale-published-owner foreign

      - name: Recycled drawable and live remap pixel regressions
        run: |
          for backend in x11rb xcb; do
            for lifecycle in reopen remap; do
              python3 scripts/test-private-perf.py --jwm target/debug/jwm --tool target/debug/jwm-tool \
                --backend "$backend" --samples 2 --seconds 2 --warmup-seconds 1 --idle-seconds 0 \
                --"$lifecycle"-producer --output "artifacts/native-lifecycle-$backend-$lifecycle"
            done
          done
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          __GLX_VENDOR_LIBRARY_NAME: mesa
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
          LP_NUM_THREADS: '2'

      - name: Retain native lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-drawable-lifecycle
          path: artifacts/native-lifecycle-*
          if-no-files-found: ignore

  feature-profiles:
    name: Feature profile (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: x11rb
            features: backend-x11rb
          - name: xcb
            features: backend-xcb
          - name: remote-x11
            features: remote-x11
          - name: xcb-remote
            features: backend-xcb,remote-x11
          - name: wayland-udev
            features: backend-wayland-udev
          - name: wayland-nested
            features: backend-wayland-nested
          - name: no-backends
            features: ""
          - name: all-backends-no-media
            features: backend-x11rb,backend-xcb,backend-wayland-udev,backend-wayland-nested,alloc-counter
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxxf86vm-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: profile-${{ matrix.profile.name }}

      - name: Check all targets without default backends
        env:
          RUSTFLAGS: -D warnings
        run: >
          cargo check --locked --all-targets --no-default-features
          ${{ matrix.profile.features != '' && format('--features {0}', matrix.profile.features) || '' }}


      - name: Test remote protocol and viewer state machines
        if: matrix.profile.name == 'remote-x11'
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo test --locked --no-default-features --features remote-x11 --lib remote::
          cargo test --locked --no-default-features --features remote-x11 --lib backend::clipboard_x11::tests::
          cargo test --locked --no-default-features --features remote-x11 --bin jwm-remote

      - name: Test remote presentation and capture on isolated X servers
        if: matrix.profile.name == 'remote-x11'
        env:
          RUSTFLAGS: -D warnings
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            sh -c 'JWM_TEST_X11_DISPLAY="$DISPLAY" cargo test --locked --no-default-features --features remote-x11 --lib remote::x11_viewer::tests:: -- --ignored --nocapture --test-threads=1'
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            sh -c 'JWM_TEST_X11_DISPLAY="$DISPLAY" cargo test --locked --no-default-features --features remote-x11 --lib remote::clipboard_sync::tests::remote_clipboard_shutdown_and_clones_on_x11 -- --ignored --nocapture --test-threads=1'
          for attempt in 1 2 3 4 5; do
            xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
              sh -c 'JWM_TEST_X11_DISPLAY="$DISPLAY" cargo test --locked --no-default-features --features remote-x11 --lib backend::clipboard_x11::tests::remote_overload_refuses_waiting_pastes_and_closes_capture -- --ignored --nocapture --test-threads=1'
          done
          xvfb-run -a -s '-screen 0 1024x768x24 -nolisten tcp' \
            sh -c 'JWM_TEST_X11_DISPLAY="$DISPLAY" env -u DISPLAY cargo test --locked --no-default-features --features remote-x11 --lib remote::x11_capture::tests::source_switch_captures_only_the_new_region_and_rejects_missing_sources -- --ignored --nocapture --test-threads=1'

  portal:
    name: Portal (xdg-desktop-portal ScreenCast backend)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            meson \
            ninja-build \
            clang \
            libclang-dev \
            dbus-daemon \
            libdbus-1-dev \
            libglib2.0-dev \
            libdrm-dev \
            libgbm-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: portal

      - name: Cache the PipeWire prefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/jwm/pipewire-prefix
          key: pipewire-prefix-${{ runner.os }}-1.6.10

      - name: Ensure PipeWire >= 1.2 development metadata
        run: bash scripts/ensure_pipewire.sh --env >> "$GITHUB_ENV"

      - name: Check the portal crate
        working-directory: portal
        run: cargo check --locked --all-targets

      - name: Lint the portal crate
        working-directory: portal
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings

      # The root job tests only the root package; without this step the
      # portal's restore-token, picker and option-parsing tests type-check
      # but never run.
      - name: Test the portal crate
        working-directory: portal
        run: cargo test --locked --all-targets

      - name: Test stream lifecycle against a private PipeWire daemon
        run: bash scripts/test-portal-pipewire.sh

  bridge:
    name: Bridge and player (notifications, MPRIS and decoding)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # zbus speaks the D-Bus wire protocol over a socket, so unlike the
      # portal this crate needs no system libraries to build. It does need a
      # `dbus-daemon` binary to *test*: ten of the bluez tests bring up a
      # private session bus, and they are the only executed coverage of the
      # SessionClosed and adapter-timeout-restore paths. Without it they skip
      # themselves and the job goes green having run none of them, which is
      # what `JWM_REQUIRE_DBUS_DAEMON` on the test step below refuses to do.
      # Bound mirror stalls without changing repositories or skipping native tests.
      - name: Install D-Bus and playback test tools
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y --no-install-recommends dbus mpv ffmpeg

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: bridge

      # Keep an explicit bridge gate because this service has a much smaller
      # dependency and runtime surface than the compositor, even though it is
      # now also a root-workspace member.
      - name: Check formatting
        working-directory: bridge
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: bridge
        run: cargo clippy --locked --all-targets --no-deps

      - name: Player Lua modern and legacy theme contracts
        run: timeout 20s mpv --no-config --vo=null --ao=null --idle=yes --script=bridge/src/player/ui_test.lua

      - name: Test
        working-directory: bridge
        env:
          # A missing dbus-daemon is a failure here, not a silent skip — the
          # same discipline JWM_REQUIRE_HEADLESS_GL applies to the GL tests.
          JWM_REQUIRE_DBUS_DAEMON: "1"
          # Exercise real audio/video decoding and single-instance MPRIS on a
          # private bus with null output sinks; no display or speakers needed.
          RUN_JWM_MPV_TESTS: "1"
        run: cargo test --locked --all-targets

  video-demo:
    name: Video demo (Rust, Python, and shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt,clippy

      - name: Cache demo-client build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: video-demo-client
          workspaces: video-demo/demo-client -> target

      # actions/setup-python v7.0.0
      - name: Install Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install shell test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check demo-client formatting
        run: >-
          cargo fmt --manifest-path video-demo/demo-client/Cargo.toml
          --all -- --check

      - name: Lint demo-client
        run: >-
          cargo clippy --manifest-path video-demo/demo-client/Cargo.toml
          --all-targets --locked -- -D warnings

      - name: Test demo-client
        run: >-
          cargo test --manifest-path video-demo/demo-client/Cargo.toml
          --all-targets --locked

      - name: Test the Python runner
        working-directory: video-demo
        run: python -m unittest discover -s tests -v

      - name: Lint session recovery script
        run: |
          bash -n video-demo/scripts/recover-session.sh
          shellcheck video-demo/scripts/recover-session.sh

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libasound2-dev \
            libdbus-1-dev \
            libudev-dev \
            libinput-dev \
            libseat-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxxf86vm-dev \
            libxcb1-dev \
            libxcb-composite0-dev \
            libxcb-damage0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev

      # The MSRV documented in Cargo.toml (rust-version). rust-toolchain.toml
      # pins the developer channel to stable, so the explicit `+1.89.0`
      # override is required here.
      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # master
        with:
          toolchain: "1.89.0"

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Check all targets on the MSRV
        run: cargo +1.89.0 check --locked --all-targets

  standalone-softbuffer-bar:
    name: Standalone tao_softbuffer_bar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install bar build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libpango1.0-dev \
            libcairo2-dev libasound2-dev libdbus-1-dev libx11-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
