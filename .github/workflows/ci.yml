name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libcairo2-dev libpango1.0-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --no-default-features
      - name: Check every adapter independently
        run: |
          for feature in clock-chrono logging-flexi provider-alsa provider-battery-sysfs provider-brightnessctl provider-system render-cairo runtime-linux transport-shared; do
            cargo check --no-default-features --all-targets --features "$feature"
          done
      - run: cargo test --no-default-features --features render-cairo
      - run: cargo test --all-targets --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --all-features --no-deps
