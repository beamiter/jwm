name: Notes AT-SPI baseline (isolated validation)
on:
  pull_request:
    branches: [dot/notes-atspi-base-0631]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  private-x11:
    if: >-
      github.repository == 'beamiter/jwm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dot/notes-atspi-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate exact Notes source and test probe logic
        run: |
          git diff --exit-code 0631f2639676e6dc1cc4d1c81cdad8d0a2804e17 -- crates/jwm_apps crates/jwm_ipc_client crates/jwm_ipc_transport
          python3 -m unittest discover -s scripts/notes-atspi -p 'test_*.py' -v
      - name: Install Ubuntu build and isolated AT-SPI dependencies
        timeout-minutes: 8
        run: |
          bash scripts/ci-install-deps.sh build-essential pkg-config libcairo2-dev libpango1.0-dev libglib2.0-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 xvfb xauth xdotool dbus-x11 at-spi2-core libatk-adaptor gir1.2-atspi-2.0 gir1.2-gtk-3.0 python3-gi
          dpkg-query -W at-spi2-core gir1.2-atspi-2.0 libgtk-3-0t64 xvfb
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Build unchanged Notes with its lockfile
        run: cargo build --locked --manifest-path crates/jwm_apps/Cargo.toml --target-dir target/notes-atspi --bin jwm-notes
      - name: Verify GTK callback and Notes AT-SPI registration on a private X11 session
        run: |
          unset DBUS_SESSION_BUS_ADDRESS AT_SPI_BUS_ADDRESS DISPLAY
          xdg_dir=$(mktemp -d)
          trap 'rmdir "$xdg_dir" 2>/dev/null || true' EXIT
          chmod 700 "$xdg_dir"
          export XDG_RUNTIME_DIR="$xdg_dir"
          env JWM_ATSPI_ISOLATED=1 timeout -k 5s 80s dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' \
            /usr/bin/python3 scripts/notes-atspi/probe.py --notes "$PWD/target/notes-atspi/debug/jwm-notes" --expect baseline
