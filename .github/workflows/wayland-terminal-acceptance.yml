name: Native Wayland terminal exit acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/wayland-terminal-acceptance.yml'
      - 'scripts/test-terminal-exit-wayland.py'
      - 'scripts/test-files-terminal-wayland.py'
      - 'scripts/test-terminal-exit-wayland-harness.py'
      - 'scripts/test-terminal-exit-x11.py'
      - 'scripts/ci-install-deps.sh'
      - 'src/**'
      - 'tools/**'
      - 'crates/**'
      - 'eva/**'
      - 'portal/**'
      - 'bridge/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'docs/native-wayland-terminal-exit.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/wayland-terminal-acceptance.yml'
      - 'scripts/test-terminal-exit-wayland.py'
      - 'scripts/test-files-terminal-wayland.py'
      - 'scripts/test-terminal-exit-wayland-harness.py'
      - 'scripts/test-terminal-exit-x11.py'
      - 'scripts/ci-install-deps.sh'
      - 'src/**'
      - 'tools/**'
      - 'crates/**'
      - 'eva/**'
      - 'portal/**'
      - 'bridge/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'docs/native-wayland-terminal-exit.md'
permissions:
  contents: read
# Native winit regression on relevant PRs, master pushes, and manual runs.
# Behavioral failures retain artifacts and remain failures, never green skips.
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # wayland-x11 baseline is retained in run 44404173276: Xvfb
        # lacks required DRI3/DRM. Do not rerun that known host mismatch.
        backend: [wayland-winit]
    env:
      CARGO_TERM_COLOR: always
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install bounded native build and private display dependencies
        timeout-minutes: 10
        run: |
          bash scripts/ci-install-deps.sh build-essential pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libasound2-dev libdbus-1-dev libudev-dev libinput-dev libseat-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxxf86vm-dev libxcb1-dev libxcb-composite0-dev \
            libxcb-damage0-dev libxcb-present-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev \
            xvfb xwayland xauth xdotool x11-utils dbus-daemon python3-pil libgtk-4-dev foot fonts-dejavu-core xdg-terminal-exec
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: native-wayland-terminal-diagnostic
          workspaces: |
            . -> target
            crates/jwm_shell -> target
      - name: Offline diagnostic contracts
        run: python3 scripts/test-terminal-exit-wayland.py --self-test
      - name: Build compositor and native wl_shm client
        run: |
          cargo build --locked --release --no-default-features --features backend-wayland-nested --bin jwm --bin jwm-tool
          cargo build --locked --manifest-path crates/jwm_shell/Cargo.toml --example native_shell_client
          cargo build --locked --manifest-path crates/jwm_files/Cargo.toml
      - name: Focused production regressions
        run: |
          for filter in nested_exit_geometry nested_terminal_visual native_visual_hook promotion_is_visual_only; do
            cargo test --locked --release --no-default-features --features backend-wayland-nested --lib "$filter"
          done
      - name: Real native pixels and stationary-pointer handoff
        timeout-minutes: 5
        run: |
          python3 scripts/test-terminal-exit-wayland.py --backend '${{ matrix.backend }}' --bin-dir target/release --client-bin crates/jwm_shell/target/debug/examples/native_shell_client --evidence-dir artifacts/native-wayland-terminal --diagnose
      - name: Drive Files into a real Wayland terminal
        timeout-minutes: 5
        run: |
          python3 scripts/test-files-terminal-wayland.py --jwm target/release/jwm \
            --jwm-tool target/release/jwm-tool --files crates/jwm_files/target/debug/jwm-files
      - name: Drive a physical Files drag between two nested Wayland windows
        timeout-minutes: 7
        run: |
          set -o pipefail
          fixture=$(cargo test --locked --manifest-path crates/jwm_files/Cargo.toml --bin jwm-files \
            --no-run --message-format=json | python3 -c '
          import json, sys
          paths = []
          for line in sys.stdin:
              row = json.loads(line)
              target = row.get("target", {})
              if row.get("reason") == "compiler-artifact" and target.get("name") == "jwm-files" and row.get("profile", {}).get("test") and row.get("executable"):
                  paths.append(row["executable"])
          assert len(paths) == 1, paths
          print(paths[0])')
          test -x "$fixture"
          python3 scripts/test-files-terminal-wayland.py --jwm target/release/jwm \
            --jwm-tool target/release/jwm-tool --drag-test "$fixture"
      - name: Retain acceptance pixels, native input receipts and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-wayland-terminal-${{ matrix.backend }}
          path: artifacts/native-wayland-terminal
          if-no-files-found: warn
