name: Supply-chain security

on:
  pull_request:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - bars/tao_glow_bar/Cargo.toml
      - bars/tao_glow_bar/Cargo.lock
      - bars/tao_pixels_bar/Cargo.toml
      - bars/tao_pixels_bar/Cargo.lock
      - video-demo/demo-client/Cargo.toml
      - video-demo/demo-client/Cargo.lock
      - .github/workflows/security.yml
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - bars/tao_glow_bar/Cargo.toml
      - bars/tao_glow_bar/Cargo.lock
      - bars/tao_pixels_bar/Cargo.toml
      - bars/tao_pixels_bar/Cargo.lock
      - video-demo/demo-client/Cargo.toml
      - video-demo/demo-client/Cargo.lock
      - .github/workflows/security.yml
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  cargo-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache cargo-audit build data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
            ~/.cargo/git
            ~/.cache/cargo-audit-target
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$HOME/.cache/cargo-audit-target" \
            cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" \
            --locked --force
          cargo audit --version | grep -Eq \
            "[[:space:]]${CARGO_AUDIT_VERSION}$"

      - name: Audit the compositor dependency graph
        id: root_audit
        shell: bash
        run: |
          set +e
          cargo audit --file Cargo.lock --json \
            > cargo-audit-root.json 2> cargo-audit-root.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -s cargo-audit-root.stderr ]]; then
            cat cargo-audit-root.stderr
          fi
          exit 0

      - name: Audit the video demo-client dependency graph
        id: demo_audit
        shell: bash
        run: |
          set +e
          cargo audit --file video-demo/demo-client/Cargo.lock --json \
            > cargo-audit-demo-client.json 2> cargo-audit-demo-client.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -s cargo-audit-demo-client.stderr ]]; then
            cat cargo-audit-demo-client.stderr
          fi
          exit 0

      - name: Audit the release bar dependency graph
        id: bar_audit
        shell: bash
        run: |
          set +e
          cargo audit --file bars/tao_pixels_bar/Cargo.lock --json \
            > cargo-audit-tao-pixels.json 2> cargo-audit-tao-pixels.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -s cargo-audit-tao-pixels.stderr ]]; then
            cat cargo-audit-tao-pixels.stderr
          fi
          exit 0

      - name: Audit the OpenGL release bar dependency graph
        id: glow_bar_audit
        shell: bash
        run: |
          set +e
          cargo audit --file bars/tao_glow_bar/Cargo.lock --json \
            > cargo-audit-tao-glow.json 2> cargo-audit-tao-glow.stderr
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -s cargo-audit-tao-glow.stderr ]]; then
            cat cargo-audit-tao-glow.stderr
          fi
          exit 0

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-audit-${{ github.run_id }}
          path: |
            cargo-audit-root.json
            cargo-audit-root.stderr
            cargo-audit-demo-client.json
            cargo-audit-demo-client.stderr
            cargo-audit-tao-pixels.json
            cargo-audit-tao-pixels.stderr
            cargo-audit-tao-glow.json
            cargo-audit-tao-glow.stderr
          if-no-files-found: error
          retention-days: 14

      - name: Fail on vulnerable dependencies or audit errors
        if: >-
          steps.root_audit.outputs.status != '0' ||
          steps.demo_audit.outputs.status != '0' ||
          steps.bar_audit.outputs.status != '0' ||
          steps.glow_bar_audit.outputs.status != '0'
        run: exit 1
