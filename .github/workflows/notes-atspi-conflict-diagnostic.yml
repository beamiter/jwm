name: Notes conflict diagnostic on pinned Markdown candidate
on:
  pull_request:
    branches: [dot/notes-atspi-conflict-diagnostic-base]
    paths:
      - '.github/workflows/notes-atspi-conflict-diagnostic.yml'
      - 'scripts/notes-atspi/**'
      - 'scripts/ci-install-deps.sh'
      - 'crates/jwm_apps/**'
      - 'crates/jwm_ipc_client/**'
      - 'crates/jwm_ipc_transport/**'

permissions:
  contents: read

concurrency:
  group: notes-atspi-mvp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  private-x11:
    if: >-
      github.repository == 'beamiter/jwm' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.ref == 'dot/notes-atspi-conflict-diagnostic' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Test probe control logic
        run: /usr/bin/python3 -m unittest discover -s scripts/notes-atspi -p 'test_*.py' -v
      - name: Install Ubuntu build and private desktop dependencies
        timeout-minutes: 8
        run: |
          bash scripts/ci-install-deps.sh build-essential pkg-config libcairo2-dev libpango1.0-dev libglib2.0-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0 xvfb xauth xdotool dbus-x11 at-spi2-core libatk-adaptor gir1.2-atspi-2.0 gir1.2-gtk-3.0 python3-gi
          dpkg-query -W at-spi2-core gir1.2-atspi-2.0 libgtk-3-0t64 xvfb
          /usr/bin/python3 -c 'import gi; gi.require_version("Atspi","2.0"); gi.require_version("Gtk","3.0"); from gi.repository import Atspi,Gtk'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.92.0'
      - name: Build pinned master, candidate, and feature-off controls with locks
        run: |
          set -euo pipefail
          baseline=0631f2639676e6dc1cc4d1c81cdad8d0a2804e17
          archive_tree="$RUNNER_TEMP/notes-atspi-baseline-src"
          mkdir -p "$archive_tree"
          git rev-parse "$baseline"
          git rev-parse HEAD
          git archive "$baseline" | tar -xf - -C "$archive_tree"
          target="$RUNNER_TEMP/notes-atspi-target"
          candidate=70462f0182564de0fc6cd741f7c3a269db85317a
          master=a38e6f59f51c34ee179f1b37ce567fdc2756f40c
          source="$RUNNER_TEMP/notes-atspi-candidate-src"
          git rev-parse "$candidate^{tree}"
          test "$(git rev-parse "$candidate^{tree}")" = 5c0efe21060405be54da9dd562531bcaff49d2c5
          test "$(git rev-parse "$candidate^")" = "$master"
          test "$(git diff --name-only "$candidate^" "$candidate")" = crates/jwm_apps/src/preview.rs
          master_source="$RUNNER_TEMP/notes-atspi-master-src"
          mkdir -p "$master_source"
          git archive "$master" | tar -xf - -C "$master_source"
          mkdir -p "$source"
          git archive "$candidate" | tar -xf - -C "$source"
          cargo build --locked --manifest-path "$archive_tree/crates/jwm_apps/Cargo.toml" --target-dir "$target" --bin jwm-notes
          install -m 700 "$target/debug/jwm-notes" "$RUNNER_TEMP/notes-baseline"
          cargo build --locked --manifest-path "$source/crates/jwm_apps/Cargo.toml" --target-dir "$target" --bin jwm-notes --no-default-features
          install -m 700 "$target/debug/jwm-notes" "$RUNNER_TEMP/notes-feature-off"
          cargo build --locked --manifest-path "$source/crates/jwm_apps/Cargo.toml" --target-dir "$target" --bin jwm-notes --no-default-features --features accessibility
          install -m 700 "$target/debug/jwm-notes" "$RUNNER_TEMP/notes-feature-on"
          cargo build --locked --manifest-path "$master_source/crates/jwm_apps/Cargo.toml" --target-dir "$target" --bin jwm-notes --no-default-features --features accessibility
          install -m 700 "$target/debug/jwm-notes" "$RUNNER_TEMP/notes-master"
          cargo test --locked --manifest-path "$source/crates/jwm_apps/Cargo.toml" --target-dir "$target" --no-default-features --features accessibility --lib app::accessibility::tests::conflict_dialog_exposes_only_live_recovery_actions -- --exact
      - name: Assert independent GTK receipt and Notes accessibility outcomes
        run: |
          unset DBUS_SESSION_BUS_ADDRESS AT_SPI_BUS_ADDRESS DISPLAY WAYLAND_DISPLAY WAYLAND_SOCKET
          probe() (
            set -euo pipefail
            xdg_dir=$(mktemp -d)
            trap 'rmdir "$xdg_dir" 2>/dev/null || true' EXIT
            chmod 700 "$xdg_dir"
            export XDG_RUNTIME_DIR="$xdg_dir"
            printf 'AT-SPI Notes variant=%s expected=%s\n' "$1" "$2"
            env JWM_ATSPI_ISOLATED=1 GSETTINGS_BACKEND=memory timeout -k 5s 80s dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' \
              /usr/bin/python3 scripts/notes-atspi/probe.py --notes "$RUNNER_TEMP/notes-$1" --expect "$2"
          )
          probe baseline baseline
          probe feature-off baseline
          probe feature-on working
          probe feature-on keyboard
          failures=0
          for variant in feature-on master master feature-on feature-on master master feature-on; do
            # Each invocation gets a newly isolated X server and D-Bus session.
            # Preserve every unsuccessful receipt; do not promote this branch.
            set +e
            probe "$variant" conflict
            result=$?
            set -e
            printf 'Conflict diagnostic variant=%s exit=%s\n' "$variant" "$result"
            if [ "$result" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          test "$failures" -eq 0
