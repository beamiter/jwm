name: Controlled GTK first-frame A/B
on:
  push:
    branches: [dot/gtk-first-frame-ab-20261115]
permissions:
  contents: read
concurrency:
  group: gtk-first-frame-ab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paired-react:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      WGPU_BACKEND: gl
      VK_ICD_FILENAMES: /nonexistent-jwm-vulkan-icd.json
      __GLX_VENDOR_LIBRARY_NAME: mesa
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify paired experiment contracts
        run: python3 scripts/test-frame-sync-ab-runner.py
      - name: Record runner identity before installation
        run: |
          mkdir -p artifacts/gtk-first-frame-ab
          {
            git rev-parse HEAD
            uname -a
            cat /etc/os-release
            printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          } > artifacts/gtk-first-frame-ab/runner.txt
      - name: Install native build and private display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libgtk-3-dev libgtk-4-dev libadwaita-1-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libasound2-dev libdbus-1-dev libudev-dev libinput-dev libseat-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxext-dev \
            libxxf86vm-dev libxcb-composite0-dev libxcb-damage0-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxrender-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri clang cmake \
            xvfb xwayland x11-utils x11-xserver-utils xdotool x11-apps dbus-x11 imagemagick python3-pil python3-dbus python3-gi alsa-utils
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: gtk-first-frame-ab-react
      - name: Build JWM and the independent host
        id: native_build
        run: |
          cargo build --locked --release --no-default-features --features backend-x11rb,backend-xcb --bin jwm --bin jwm-tool
          cargo build --locked --release -p jwm-bridge --bin jwm-bridge
          cargo build --locked --manifest-path crates/jwm_shell/Cargo.toml
      - name: Install React frontend tools
        run: |
          npm install -g pnpm
          cargo install tauri-cli --version 2.12.4 --locked
          pnpm --dir bars/tauri_react_bar install --frozen-lockfile
      - name: Build one React debug binary for both arms
        run: |
          python3 scripts/validate-shared-shell-matrix.py --bars tauri_react_bar \
            --jobs 1 --build-only --output artifacts/gtk-first-frame-ab/build.json
      - name: Record installed dependencies and tool versions
        if: always()
        run: |
          dpkg-query -W -f='${binary:Package}\t${Version}\n' > artifacts/gtk-first-frame-ab/packages.tsv
          python3 - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          commands = [['rustc', '-Vv'], ['cargo', '-V'], ['cargo', 'tauri', '--version'],
                      ['node', '--version'], ['pnpm', '--version'],
                      ['pkg-config', '--modversion', 'gtk+-3.0', 'webkit2gtk-4.1', 'glib-2.0'],
                      ['Xvfb', '-version']]
          results = []
          for command in commands:
              try:
                  run = subprocess.run(command, text=True, capture_output=True, timeout=15)
                  results.append(dict(command=command, returncode=run.returncode,
                                      stdout=run.stdout, stderr=run.stderr))
              except (OSError, subprocess.TimeoutExpired) as error:
                  results.append(dict(command=command, error=str(error)))
          Path('artifacts/gtk-first-frame-ab/tools.json').write_text(json.dumps(results, indent=2))
          PYCODE
      - name: Exercise twelve pairs with identical compiled binaries
        run: |
          binary=$(python3 -c 'import json; print(json.load(open("artifacts/gtk-first-frame-ab/build.json"))["frontends"][0]["binary"])')
          sha256sum "$binary" target/release/jwm target/release/jwm-tool crates/jwm_shell/target/debug/jwm-shell > artifacts/gtk-first-frame-ab/binaries.sha256
          python3 scripts/test-frame-sync-ab.py --pairs 12 --bar-bin "$binary" \
            --bin-dir target/release --shell-bin crates/jwm_shell/target/debug/jwm-shell \
            --evidence-dir artifacts/gtk-first-frame-ab/pairs
      - name: Verify binary identities after both arms
        if: ${{ !cancelled() && hashFiles('artifacts/gtk-first-frame-ab/binaries.sha256') != '' }}
        run: sha256sum --check artifacts/gtk-first-frame-ab/binaries.sha256
      - name: Archive all paired outcomes and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gtk-first-frame-ab-react
          path: artifacts/gtk-first-frame-ab
          if-no-files-found: error
