name: Winit Notes live search first-frame A/B
on:
  pull_request:
    branches: ['dot/winit-notebook-query-ab-base']
    types: [opened, synchronize, reopened, converted_to_draft]
    paths:
      - '.github/workflows/winit-notebook-query-ab.yml'
      - 'scripts/winit-notebook-query-ab.py'

permissions:
  contents: read

concurrency:
  group: winit-notebook-query-ab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  A: 531439dc43317a9e7c1b853c353728a772e351c8
  A_TREE: 11617868cb6dc8c15dc77d32cec1f64786b56edb
  B: eb9128ff5c7e3ab390fac3169d5073744d30aa7f
  B_TREE: 03cd161d71ff19ba783354a6f2f5988d1798043f

jobs:
  evidence:
    if: >-
      github.repository == 'beamiter/jwm' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'dot/winit-notebook-query-ab-base' &&
      github.event.pull_request.head.ref == 'dot/winit-notebook-query-ab-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize always-retained evidence
        run: mkdir -m 700 evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/jwm
          ref: ${{ env.B }}
          fetch-depth: 3
          path: source-b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/jwm
          ref: ${{ env.A }}
          fetch-depth: 3
          path: source-a
          persist-credentials: false
      - name: Verify exact pins and validation-only scope
        timeout-minutes: 3
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_BASE" = "$A"
          test "$(git -C fixture rev-parse HEAD)" = "$EVENT_HEAD"
          git -C fixture merge-base --is-ancestor "$A" HEAD
          git -C fixture diff --exit-code "$A" HEAD -- . ':!.github/workflows/winit-notebook-query-ab.yml' ':!scripts/winit-notebook-query-ab.py'
          test "$(git -C source-a rev-parse HEAD)" = "$A"
          test "$(git -C source-a rev-parse 'HEAD^{tree}')" = "$A_TREE"
          test "$(git -C source-b rev-parse HEAD)" = "$B"
          test "$(git -C source-b rev-parse 'HEAD^{tree}')" = "$B_TREE"
          test "$(git -C source-b rev-parse 'HEAD^1')" = "$A"
          expected_paths=$(printf '%s\n' crates/jwm_apps/src/app.rs crates/jwm_apps/src/app/accessibility.rs crates/jwm_apps/src/host.rs crates/jwm_apps/src/notes.rs)
          test "$(git -C source-b diff --name-only "$A" HEAD)" = "$expected_paths"
          for d in fixture source-a source-b; do
            test -z "$(git -C "$d" -c core.fsmonitor=false status --porcelain --untracked-files=all)"
            git -C "$d" rev-parse HEAD 'HEAD^{tree}' > "evidence/${d}-revision.txt"
          done
          sha256sum fixture/scripts/winit-notebook-query-ab.py > evidence/fixture.sha256
          /usr/bin/python3 -I -m py_compile fixture/scripts/winit-notebook-query-ab.py
      - name: Install signed graphics, Xvfb and Pinyin dependencies as in #156
        timeout-minutes: 12
        env:
          JWM_CI_PREFETCH_CJK: "1"
        run: |
          set -euo pipefail
          unset JWM_CI_APT_SOURCES
          bash source-b/scripts/ci-install-deps.sh build-essential pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libasound2-dev libdbus-1-dev libudev-dev libinput-dev libseat-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxext-dev libxxf86vm-dev libxcb1-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev \
            xvfb xauth xdotool x11-utils xwayland imagemagick dbus-x11 fonts-noto-cjk \
            fcitx5 fcitx5-pinyin fcitx5-modules 2>&1 | tee evidence/dependency-install.log
          dpkg-query -W 'fcitx5*' xvfb xdotool libgl1-mesa-dri fonts-noto-cjk > evidence/dependencies.txt
          fcitx5 --version >> evidence/dependencies.txt 2>&1
          dpkg-query -L fcitx5-modules | grep -E "(classicui|waylandim)\.(conf|so)$" >> evidence/dependencies.txt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        timeout-minutes: 6
        with:
          toolchain: stable
      - name: Cold exact release JWM and Notes builds
        timeout-minutes: 65
        run: |
          set -euo pipefail
          toolbin="$(dirname "$(rustup which cargo)")"
          mkdir -m 700 build-home build-cargo build-config
          "$toolbin/cargo" --version --verbose > evidence/cargo.txt
          "$toolbin/rustc" --version --verbose > evidence/rustc.txt
          sha256sum "$toolbin/cargo" "$toolbin/rustc" /usr/bin/python3 > evidence/tools.sha256
          build() {
            local origin="$1" expected="$2" log="$3" bound="$4"
            shift 4
            (
              cd "$origin"
              test -z "$(git -c core.fsmonitor=false status --porcelain --untracked-files=all)"
              test "$(git rev-parse HEAD)" = "$expected"
              env -i PATH="$toolbin:/usr/bin:/bin" HOME="$GITHUB_WORKSPACE/build-home" \
                CARGO_HOME="$GITHUB_WORKSPACE/build-cargo" XDG_CONFIG_HOME="$GITHUB_WORKSPACE/build-config" \
                RUSTC="$toolbin/rustc" CARGO_BUILD_JOBS=2 LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
                timeout -k 15s "$bound" "$toolbin/cargo" "$@"
              test -z "$(git -c core.fsmonitor=false status --porcelain --untracked-files=all)"
              test "$(git rev-parse HEAD)" = "$expected"
            ) 2>&1 | tee "$log"
          }
          test ! -e source-b/target
          build source-a "$A" evidence/jwm-build.log 25m build --locked --release --no-default-features --features backend-wayland-nested --bin jwm
          build source-a "$A" evidence/notes-a-build.log 23m build --locked --release --manifest-path crates/jwm_apps/Cargo.toml --bin jwm-notes --target-dir target/fcitx-notes
          build source-b "$B" evidence/notes-b-build.log 23m build --locked --release --manifest-path crates/jwm_apps/Cargo.toml --bin jwm-notes --target-dir target/fcitx-notes
          sha256sum source-a/target/release/jwm source-{a,b}/target/fcitx-notes/release/jwm-notes > evidence/binaries.sha256
      - name: Run interleaved A/B search on 1,000 multilingual notes
        timeout-minutes: 22
        run: |
          set -euo pipefail
          unset DISPLAY XAUTHORITY WAYLAND_DISPLAY WAYLAND_SOCKET DBUS_SESSION_BUS_ADDRESS DBUS_SYSTEM_BUS_ADDRESS
          sha256sum -c evidence/binaries.sha256
          sha256sum -c evidence/fixture.sha256
          response=0
          for trial in 1 2 3 4; do
            if (( trial % 2 )); then
              roles=(A B)
            else
              roles=(B A)
            fi
            for role in "${roles[@]}"; do
              corpus=multilingual
              count=1000
              if [[ "$role" == A ]]; then
                pin="$A"
                source_dir=source-a
              else
                pin="$B"
                source_dir=source-b
              fi
              mode="$trial-$role-$corpus-$count"
              scope=$(mktemp -d)
              install -d -m 700 "$scope"/{config,run}
              if env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                HOME="$scope" XDG_CONFIG_HOME="$scope/config" XDG_RUNTIME_DIR="$scope/run" \
                JWM_FCITX_ISOLATED=1 GSETTINGS_BACKEND=memory \
                timeout -k 15s 150s dbus-run-session -- \
                /usr/bin/python3 -I fixture/scripts/winit-notebook-query-ab.py \
                  --role "$role" --source "$pin" --jwm "$PWD/source-a/target/release/jwm" \
                  --notes "$PWD/$source_dir/target/fcitx-notes/release/jwm-notes" \
                  --out "$PWD/evidence/$mode" --note-count "$count" --corpus "$corpus" --row-reference "$PWD/evidence/baseline-row.sha256" 2>&1 | tee "evidence/$mode.log"; then
                printf 'success\n' > "evidence/$mode.exit"
              else
                rc=$?
                printf '%s\n' "$rc" > "evidence/$mode.exit"
                response=1
              fi
              rm -rf -- "$scope"
            done
          done
          exit "$response"
      - name: Retain PNG, protocol, source pins and failed-case evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: winit-notebook-query-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
