name: Controlled-startup native popup GTK3 compatibility

# Separate opt-in experiment. Does not replace the dynamic-seat workflow or
# reinterpret its known failure as compatibility. Master trigger awaits review.

on:
  push:
    branches: [dot/remote-popup-controlled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-popup-controlled-gtk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gtk3-controlled-startup-popup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      JWM_REQUIRE_HEADLESS_GL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install official GTK3 and native software-renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev \
            libudev-dev libinput-dev libseat-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libegl-mesa0 libgl1-mesa-dri xvfb xauth libx11-dev libx11-xcb-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-screensaver0-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Compile real GTK3 menu probe
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror scripts/remote-popup-gtk-probe.c \
            $(pkg-config --cflags --libs gtk+-3.0) -o "${{ runner.temp }}/remote-popup-gtk-probe"
          test -x "${{ runner.temp }}/remote-popup-gtk-probe"
          printf 'JWM_REMOTE_POPUP_GTK_PROBE=%s\n' "${{ runner.temp }}/remote-popup-gtk-probe" >> "$GITHUB_ENV"
      - name: Require controlled-startup GTK3 local default and prepared-seat menu
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          trap 'rm -rf "$XDG_RUNTIME_DIR"' EXIT
          filter='backend::wayland_udev::remote_popup::gtk_tests::controlled_startup_gtk_menu_preserves_local_default_and_uses_prepared_seat'
          listed="$(env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib "$filter" -- --ignored --exact --list)"
          test "$(printf '%s\n' "$listed" | grep -c ': test$')" -eq 1
          printf '%s\n' "$listed" | grep -Fx "$filter: test"
          # Keep raw process diagnostics on this ephemeral runner, not in artifacts
          # or public log output. A failure remains a hard job failure.
          log="${{ runner.temp }}/remote-popup-controlled-gtk-result.log"
          if ! env -u DISPLAY -u WAYLAND_DISPLAY cargo test --locked --no-default-features --features remote-wayland,backend-wayland-udev --lib "$filter" -- --ignored --exact --test-threads=1 --nocapture > "$log" 2>&1; then
            echo 'Controlled-startup GTK3 popup check failed; no fallback or skipped acceptance.'
            python3 - "$log" <<'PYDIAG'
          import pathlib, sys
          # Never emit matched text, paths, exception details or arbitrary panic strings.
          with pathlib.Path(sys.argv[1]).open("rb") as stream:
              raw = stream.read(2 * 1024 * 1024)
          labels = {
              b"GTK probe reported duplicate activation or deadline": "probe_reported_failure",
              b"GTK local default seat changed": "local_default_changed",
              b"GTK local default input pixel deadline": "local_default_pixel_timeout",
              b"retired private seat must never become visible to foreign client": "retired_seat_visibility_violation",
              b"GTK root never mapped": "root_mapping_timeout",
              b"GTK exited before mapping": "process_exited_before_mapping",
              b"GTK source must match bounded root geometry": "root_geometry_mismatch",
              b"real production GL frame not ready": "capture_not_ready",
              b"actual GTK initial blue drawing area": "initial_canvas_mismatch",
              b"explicit popup lease grant": "lease_not_granted",
              b"GTK lease revoked before seat binding": "lease_revoked_before_binding",
              b"GTK did not bind the newly advertised private pointer; no main-seat fallback": "private_pointer_binding_timeout",
              b"actual arm": "arm_not_confirmed",
              b"GTK popup/serial unsupported: native lease revoked": "popup_serial_lease_revoked",
              b"GTK did not create and restricted-grab its menu from the real click": "popup_grab_timeout",
              b"popup rectangle below the button must contain actual changed pixels": "popup_pixels_missing",
              b"independent unchanged canvas evidence outside popup required": "outside_canvas_evidence_missing",
              b"actual popup selection dispatch": "selection_not_accepted",
              b"activation/pixel deadline": "activation_pixel_timeout",
              b"activation/readback deadline": "activation_readback_timeout",
              b"GTK exited before activation/pixel evidence completed": "process_exited_before_evidence",
              b"actual production capture must show new green app canvas": "final_canvas_mismatch",
              b"display.sync timeout": "display_sync_timeout",
              b"mandatory actual GL renderer required": "renderer_unavailable",
          }
          stages = (
              "root_mapped", "initial_capture", "lease_granted", "private_pointer_bound",
              "armed", "root_clicked", "popup_mapped", "popup_captured",
              "selection_dispatched", "activation_verified",
              "local_default_verified", "prepared_seat_retired",
          )
          lines = set(raw.splitlines())
          for stage in stages:
              if ("JWM_GTK_STAGE=" + stage).encode("ascii") in lines:
                  print("GTK_PROBE_COMPLETED_STAGE=" + stage)
          matches = [label for needle, label in labels.items() if needle in raw]
          for label in matches or ["unclassified_failure"]:
              print("GTK_PROBE_FAILURE_CATEGORY=" + label)
          PYDIAG
            exit 1
          fi
          grep -Eq '^test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"
          echo 'Controlled-startup GTK3 only: 1 passed, 0 ignored (owned software GL; dynamic-seat compatibility not established).'
