name: Astronomy shader

on:
  push:
    paths:
      - src/backend/compositor_common/animated_wallpaper.rs
      - src/backend/compositor_common/celestial_layout.rs
      - src/backend/compositor_common/celestial_catalog.rs
      - src/backend/compositor_common/panorama.rs
      - src/backend/x11/compositor/astronomy_wallpaper.rs
      - src/backend/x11/compositor/shaders/animated_wallpaper.frag
      - src/backend/x11/compositor/shaders/planet_surface.glsl
      - src/backend/x11/compositor/shaders/solar_optics.glsl
      - src/backend/x11/compositor/shaders/cosmic_sky.glsl
      - src/backend/x11/compositor/procedural_wallpaper_cache.rs
      - src/config.rs
      - src/config/**
      - assets/astronomy/**
      - scripts/test-astronomy-shader.py
      - scripts/test-astronomy-assets.py
      - scripts/prepare-astronomy-*.py
      - scripts/install_jwm_scripts.sh
      - packaging/release-manifest.tsv
      - rust-toolchain.toml
      - .github/workflows/astronomy-shader.yml
  pull_request:
    paths:
      - src/backend/compositor_common/animated_wallpaper.rs
      - src/backend/compositor_common/celestial_layout.rs
      - src/backend/compositor_common/celestial_catalog.rs
      - src/backend/compositor_common/panorama.rs
      - src/backend/x11/compositor/astronomy_wallpaper.rs
      - src/backend/x11/compositor/shaders/animated_wallpaper.frag
      - src/backend/x11/compositor/shaders/planet_surface.glsl
      - src/backend/x11/compositor/shaders/solar_optics.glsl
      - src/backend/x11/compositor/shaders/cosmic_sky.glsl
      - src/backend/x11/compositor/procedural_wallpaper_cache.rs
      - src/config.rs
      - src/config/**
      - assets/astronomy/**
      - scripts/test-astronomy-shader.py
      - scripts/test-astronomy-assets.py
      - scripts/prepare-astronomy-*.py
      - scripts/install_jwm_scripts.sh
      - packaging/release-manifest.tsv
      - rust-toolchain.toml
      - .github/workflows/astronomy-shader.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astronomy-shader-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mesa:
    name: Real-time astronomy on desktop GL and GLES
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_SHADER_CACHE_DISABLE: 'true'
      RUSTC: rustc
      RUST_BACKTRACE: '1'
      ASTRONOMY_TEST_OUTPUT: ${{ github.workspace }}/target/astronomy-shader
      PREVIEW_WIDTH: '960'
      PREVIEW_HEIGHT: '540'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Mesa and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            glslang-tools \
            libegl1-mesa-dev \
            libegl-mesa0 \
            libgl1-mesa-dri \
            libgles2 \
            python3-pil

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Rotation, zoom, panorama, solar clock and lunar phase regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ASTRONOMY_TEST_OUTPUT"
          python3 - "$ASTRONOMY_TEST_OUTPUT/navigation-tests.rs" <<'PY'
          import json
          import sys
          from pathlib import Path
          root = Path.cwd() / "src/backend/compositor_common"
          modules = ("animated_wallpaper", "panorama")
          Path(sys.argv[1]).write_text("".join(
              f"#[path={json.dumps(str(root / (name + '.rs')))}] mod {name};\n"
              for name in modules
          ))
          PY
          rustc --edition=2024 --test \
            "$ASTRONOMY_TEST_OUTPUT/navigation-tests.rs" \
            -Awarnings -o "$ASTRONOMY_TEST_OUTPUT/astronomy-common-tests"
          "$ASTRONOMY_TEST_OUTPUT/astronomy-common-tests" \
            2>&1 | tee "$ASTRONOMY_TEST_OUTPUT/common-tests.log"

      - name: Verify bundled assets through install, upgrade and rollback
        run: /usr/bin/python3 scripts/test-astronomy-assets.py

      - name: Render complete desktop GL and GLES regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ASTRONOMY_TEST_OUTPUT"
          # Both APIs cover zoom/detail, all-axis body and panorama gestures,
          # true-time lighting, map filtering and multi-output/portrait layouts.
          /usr/bin/python3 scripts/test-astronomy-shader.py \
            2>&1 | tee "$ASTRONOMY_TEST_OUTPUT/render-tests.log"

      - name: Upload failure frames and diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: astronomy-shader-${{ github.event_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.ASTRONOMY_TEST_OUTPUT }}/*.png
            ${{ env.ASTRONOMY_TEST_OUTPUT }}/earth-validation.json
            ${{ env.ASTRONOMY_TEST_OUTPUT }}/*.log
          if-no-files-found: warn
          retention-days: 7
