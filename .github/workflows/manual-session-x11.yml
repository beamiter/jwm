name: Manual X11 session acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]
    branches: ['dot/manual-session-x11-product-base']
    paths:
      - '.github/workflows/manual-session-x11.yml'
      - 'scripts/manual-session-x11/**'
permissions:
  contents: read
concurrency:
  group: manual-session-x11-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  BASELINE_SHA: 9b3974b31566a2ae1bb6fe33cfb9642762434bf6
  PRODUCT_SHA: 4df4d36b36e649d2c7e36e8d480ce04f644a9842
  COMBINED_SHA: c2fec065c4a891712e7a4f34eb5dfbb8a6893cb6
  COMBINED_TREE: 3e3a3ccd47b62de19702dcc5774cfca2fe1391ea
jobs:
  acceptance:
    if: >-
      github.repository == 'beamiter/jwm' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'dot/manual-session-x11-product-base' &&
      github.event.pull_request.head.ref == 'dot/manual-session-x11-validation'
    strategy:
      fail-fast: false
      matrix:
        role: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Initialize always-retained evidence
        run: mkdir -m 700 evidence
      - name: Check out exact fixture head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: fixture
          persist-credentials: false
      - name: Check out exact baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/jwm
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Verify provenance, fixtures, and exact combination
        timeout-minutes: 5
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
          FIXTURE_HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EVENT_BASE" > evidence/event-base.txt
          test "$EVENT_BASE" = "$COMBINED_SHA"
          test "$(git -C fixture rev-parse HEAD)" = "$FIXTURE_HEAD"
          test "$(git -C source rev-parse HEAD)" = "$BASELINE_SHA"
          sha256sum fixture/scripts/manual-session-x11/* > evidence/fixture.sha256
          git -C source fetch --no-tags origin "$COMBINED_SHA"
          test "$(git -C source rev-parse FETCH_HEAD)" = "$COMBINED_SHA"
          test "$(git -C source show -s --format=%P "$COMBINED_SHA")" = "$BASELINE_SHA $PRODUCT_SHA"
          git -C fixture merge-base --is-ancestor "$COMBINED_SHA" HEAD
          # Ensure publishing the fixture did not silently modify product files.
          unexpected=$(git -C fixture diff --name-only "$COMBINED_SHA" HEAD -- . \
            ':!.github/workflows/manual-session-x11.yml' ':!scripts/manual-session-x11')
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected difference between producer commit and fixture head'; exit 1
          fi
          tree=$(git -C source merge-tree --write-tree "$BASELINE_SHA" "$PRODUCT_SHA")
          test "$tree" = "$COMBINED_TREE"
          test "$(git -C source rev-parse "$COMBINED_SHA^{tree}")" = "$COMBINED_TREE"
          printf 'baseline=%s\nproduct=%s\ncombined_tree=%s\n' "$BASELINE_SHA" "$PRODUCT_SHA" "$tree" > evidence/pins.txt
          if [[ "$ROLE" == candidate ]]; then
            git -C source -c core.hooksPath=/dev/null checkout --detach "$COMBINED_SHA"
          fi
          git -C source rev-parse HEAD 'HEAD^{tree}' > evidence/source.txt
      - name: Install signed Ubuntu dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          unset JWM_CI_APT_SOURCES JWM_CI_PREFETCH_CJK
          bash source/scripts/ci-install-deps.sh \
            build-essential pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libasound2-dev libdbus-1-dev libudev-dev libinput-dev libseat-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxext-dev \
            libxxf86vm-dev libxcb1-dev libxcb-composite0-dev libxcb-damage0-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev \
            xvfb xdotool x11-apps x11-utils xauth libxres1 2>&1 | tee evidence/deps.log
          dpkg-query -W > evidence/packages.txt
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        timeout-minutes: 6
        with:
          toolchain: stable
      - name: Offline verifier and lifecycle contracts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY' 2>&1 | tee evidence/contracts.log
          import pathlib,unittest
          p=pathlib.Path('fixture/scripts/manual-session-x11').resolve()
          raise SystemExit(not unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover(str(p),pattern='test_*.py')).wasSuccessful())
          PY
      - name: Cold build exact source
        timeout-minutes: 43
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          sha=$(head -n 1 evidence/source.txt)
          toolbin="$(dirname "$(rustup which cargo)")"
          mkdir -m 700 build-home build-cargo build-config
          sha256sum "$toolbin/cargo" "$toolbin/rustc" /usr/bin/python3 > evidence/tools.sha256
          timeout -k 10 2400 env -i PATH="$toolbin:/usr/bin:/bin" HOME="$PWD/build-home" \
            CARGO_HOME="$PWD/build-cargo" XDG_CONFIG_HOME="$PWD/build-config" \
            RUSTC="$toolbin/rustc" CARGO_BUILD_JOBS=2 LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
            /bin/bash fixture/scripts/manual-session-x11/build.sh "$PWD/source" "$PWD/evidence/build" "$ROLE" "$sha" \
            2>&1 | tee evidence/build.log
      - name: Actual isolated X11 manual save and restore
        timeout-minutes: 4
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          timeout -k 35 145 env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            /usr/bin/python3 -I fixture/scripts/manual-session-x11/probe.py --role "$ROLE" \
            --binary "$PWD/source/target/release/jwm" --receipt "$PWD/evidence/build/build.json" \
            --out "$PWD/evidence/probe" 2>&1 | tee evidence/probe.log
      - name: Retain pass or failure evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manual-session-x11-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
