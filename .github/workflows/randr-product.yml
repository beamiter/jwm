# UNPUBLISHED: independent acceptance proposal, not a product or preflight update.
name: Private RandR X11RB baseline and fixed acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/randr-product.yml'
      - 'scripts/randr-product/**'
permissions:
  contents: read
jobs:
  exact-source-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize evidence before dependencies
        run: |
          mkdir -m 700 artifacts
          git rev-parse HEAD > artifacts/workflow-checkout.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha }}' > artifacts/workflow-head.txt
          printf '%s\n' 'https://github.com/beamiter/jwm/actions/runs/44457576001' \
            'head=f4018fab5c55e3bc9098b678824d2803fbdbc041' \
            'artifact=14498727399' \
            'zip_sha256=3a1a45518254f888037d144e0db1890d75f4a3ca81eeac57b5d5f5eadc25cc29' \
            'Historical prerequisite only; not this product run or JWM proof.' \
            > artifacts/prior-preflight.txt
      - name: Official signed runner-distribution dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-install-deps.sh build-essential pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libasound2-dev libdbus-1-dev libudev-dev libinput-dev libseat-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxxf86vm-dev libxcb1-dev libxcb-composite0-dev \
            libxcb-damage0-dev libxcb-present-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev \
            xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils x11-utils xdotool dbus-daemon \
            2>&1 | tee artifacts/dependencies.log
          dpkg-query -W > artifacts/packages.txt
          apt-cache policy xserver-xorg-core xserver-xorg-video-dummy > artifacts/package-policy.txt
          sha256sum /usr/lib/xorg/modules/drivers/dummy_drv.so > artifacts/driver-sha256.txt
      - name: Official Rust stable toolchain
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Offline safety and provenance contracts
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY' 2>&1 | tee artifacts/offline-contracts.log
          import pathlib, sys, unittest
          root = pathlib.Path('scripts/randr-product').resolve(strict=True)
          sys.path.insert(0, str(root))
          suite = unittest.defaultTestLoader.discover(str(root), pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Two cold exact builds and four private X11 sessions
        # Builder has its own 40-minute command deadline; each of four fresh
        # owned servers is capped at 180 seconds, with bounded child cleanup.
        # No build cache action or arbitrary prebuilt binary/receipt input.
        timeout-minutes: 55
        shell: bash
        run: |
          set -euo pipefail
          toolchain_bin="$(dirname "$(rustup which cargo)")"
          /usr/bin/python3 -I scripts/randr-product/build_and_probe.py \
            --toolchain-bin "$toolchain_bin" --output artifacts/randr-product \
            2>&1 | tee artifacts/orchestrator.log
      - name: Preserve all success and failure evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: private-randr-product-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
