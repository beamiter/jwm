name: Winit Fcitx popup A/B evidence
on:
  pull_request:
    branches: ['dot/winit-ime-popup-465-base']
    types: [opened, synchronize, reopened, converted_to_draft]
    paths:
      - '.github/workflows/winit-ime-popup-ab.yml'
      - 'scripts/winit-ime-popup-ab.py'

permissions:
  contents: read

concurrency:
  group: winit-ime-popup-ab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  A: 465a8bdba283777d2fc0f55d62271c6ff0acee82
  B: 7680aad1242a9f9376147bb2736f2ceddfd1cebf
  B_TREE: 3845ac792089658762a70012390bf602659e1459

jobs:
  evidence:
    if: >-
      github.repository == 'beamiter/jwm' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'dot/winit-ime-popup-465-base' &&
      github.event.pull_request.head.ref == 'dot/winit-ime-popup-465-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize always-retained evidence
        run: mkdir -m 700 evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/jwm
          ref: ${{ env.A }}
          path: source-a
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/jwm
          ref: ${{ env.B }}
          fetch-depth: 2
          path: source-b
          persist-credentials: false
      - name: Verify exact pins and validation-only scope
        timeout-minutes: 3
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_BASE" = "$B"
          test "$(git -C fixture rev-parse HEAD)" = "$EVENT_HEAD"
          git -C fixture merge-base --is-ancestor "$B" HEAD
          git -C fixture diff --exit-code "$B" HEAD -- . ':!.github/workflows/winit-ime-popup-ab.yml' ':!scripts/winit-ime-popup-ab.py'
          test "$(git -C source-a rev-parse HEAD)" = "$A"
          test "$(git -C source-b rev-parse HEAD)" = "$B"
          test "$(git -C source-b rev-parse 'HEAD^{tree}')" = "$B_TREE"
          test "$(git -C source-b rev-parse 'HEAD^2')" = "$A"
          test "$(git -C source-a rev-parse 'HEAD^{tree}')" = "0a953348f1fd6885bf8b78e54c61d59f051c4932"
          expected_paths=$(printf '%s\n' src/backend/wayland_udev/state.rs src/backend/wayland_winit/backend.rs)
          test "$(git -C source-b diff --name-only "$A" HEAD)" = "$expected_paths"
          for d in fixture source-a source-b; do
            test -z "$(git -C "$d" -c core.fsmonitor=false status --porcelain --untracked-files=all)"
            git -C "$d" rev-parse HEAD 'HEAD^{tree}' > "evidence/${d}-revision.txt"
          done
          sha256sum fixture/scripts/winit-ime-popup-ab.py > evidence/fixture.sha256
          /usr/bin/python3 -I -m py_compile fixture/scripts/winit-ime-popup-ab.py
      - name: Install signed graphics, Xvfb and Pinyin dependencies as in #156
        timeout-minutes: 12
        env:
          JWM_CI_PREFETCH_CJK: "1"
        run: |
          set -euo pipefail
          unset JWM_CI_APT_SOURCES
          bash source-a/scripts/ci-install-deps.sh build-essential pkg-config libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libasound2-dev libdbus-1-dev libudev-dev libinput-dev libseat-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxext-dev libxxf86vm-dev libxcb1-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev libxrender-dev \
            xvfb xauth xdotool x11-utils xwayland imagemagick dbus-x11 fonts-noto-cjk \
            fcitx5 fcitx5-pinyin fcitx5-modules 2>&1 | tee evidence/dependency-install.log
          dpkg-query -W 'fcitx5*' xvfb xdotool libgl1-mesa-dri fonts-noto-cjk > evidence/dependencies.txt
          fcitx5 --version >> evidence/dependencies.txt 2>&1
          dpkg-query -L fcitx5-modules | grep -E "(classicui|waylandim)\.(conf|so)$" >> evidence/dependencies.txt
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        timeout-minutes: 6
        with:
          toolchain: stable
      - name: Cold locked A and B JWM builds and one shared Notes build
        timeout-minutes: 68
        run: |
          set -euo pipefail
          toolbin="$(dirname "$(rustup which cargo)")"
          mkdir -m 700 build-home build-cargo build-config
          "$toolbin/cargo" --version --verbose > evidence/cargo.txt
          "$toolbin/rustc" --version --verbose > evidence/rustc.txt
          sha256sum "$toolbin/cargo" "$toolbin/rustc" /usr/bin/python3 > evidence/tools.sha256
          build() {
            local origin="$1" expected="$2" log="$3" bound="$4"
            shift 4
            (
              cd "$origin"
              test -z "$(git -c core.fsmonitor=false status --porcelain --untracked-files=all)"
              test "$(git rev-parse HEAD)" = "$expected"
              env -i PATH="$toolbin:/usr/bin:/bin" HOME="$GITHUB_WORKSPACE/build-home" \
                CARGO_HOME="$GITHUB_WORKSPACE/build-cargo" XDG_CONFIG_HOME="$GITHUB_WORKSPACE/build-config" \
                RUSTC="$toolbin/rustc" CARGO_BUILD_JOBS=2 LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
                timeout -k 15s "$bound" "$toolbin/cargo" "$@"
              test -z "$(git -c core.fsmonitor=false status --porcelain --untracked-files=all)"
              test "$(git rev-parse HEAD)" = "$expected"
            ) 2>&1 | tee "$log"
          }
          test ! -e source-a/target && test ! -e source-b/target
          build source-a "$A" evidence/jwm-A-build.log 25m build --locked --release --no-default-features --features backend-wayland-nested --bin jwm
          build source-b "$B" evidence/jwm-B-build.log 25m build --locked --release --no-default-features --features backend-wayland-nested --bin jwm
          build source-a "$A" evidence/notes-build.log 15m build --locked --manifest-path crates/jwm_apps/Cargo.toml --bin jwm-notes --target-dir target/fcitx-notes
          sha256sum source-a/target/release/jwm source-b/target/release/jwm source-a/target/fcitx-notes/debug/jwm-notes > evidence/binaries.sha256
      - name: A and B real protocol and owned outer-window PNG evidence
        timeout-minutes: 8
        run: |
          set -euo pipefail
          unset DISPLAY XAUTHORITY WAYLAND_DISPLAY WAYLAND_SOCKET DBUS_SESSION_BUS_ADDRESS DBUS_SYSTEM_BUS_ADDRESS
          sha256sum -c evidence/binaries.sha256
          sha256sum -c evidence/fixture.sha256
          response=0
          for role in A B; do
            src="source-${role,,}"
            scope=$(mktemp -d)
            install -d -m 700 "$scope"/{config,run}
            if env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              HOME="$scope" XDG_CONFIG_HOME="$scope/config" XDG_RUNTIME_DIR="$scope/run" \
              JWM_FCITX_ISOLATED=1 GSETTINGS_BACKEND=memory \
              timeout -k 15s 150s dbus-run-session -- \
              /usr/bin/python3 -I fixture/scripts/winit-ime-popup-ab.py \
                --role "$role" --source "${!role}" --jwm "$PWD/$src/target/release/jwm" \
                --notes "$PWD/source-a/target/fcitx-notes/debug/jwm-notes" \
                --out "$PWD/evidence/probe-$role" 2>&1 | tee "evidence/probe-$role.log"; then
              printf 'success\n' > "evidence/probe-$role.exit"
            else
              rc=$?
              printf '%s\n' "$rc" > "evidence/probe-$role.exit"
              response=1
            fi
            rm -rf -- "$scope"
          done
          exit "$response"
      - name: Prove matching nonvisual gates and require independent pixel review
        timeout-minutes: 2
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("evidence")
          expected = "popup-frame-and-commit-verified-pixel-review-pending"
          records = {}
          digests = {path: digest for digest, path in (line.split() for line in (root/"binaries.sha256").read_text().splitlines())}
          for role in ("A", "B"):
              folder = root/f"probe-{role}"
              r = json.loads((folder/"result.json").read_text())
              assert r["status"] == expected and r["source"] == os.environ[role] and r["role"] == role
              assert r["binary_sha256"] == {
                  "jwm": digests[f"source-{role.lower()}/target/release/jwm"],
                  "notes": digests["source-a/target/fcitx-notes/debug/jwm-notes"],
              }
              p = r["candidate_evidence"]
              assert r["preedit"]["final_ni_hao_done"] and r["commit"]["notes_and_engine_once"] and r["commit"]["saved"] == "你好"
              for item in (r["idle_capture"], p["capture"], r["commit"]["image"]):
                  data = (folder/item["image"]).read_bytes()
                  assert len(data) < 8 * 1024 * 1024 and hashlib.sha256(data).hexdigest() == item["sha256"]
              assert p["frame_observed_monotonic_ns"] < p["capture"]["capture_started_ns"]
              assert p["capture"]["capture_completed_ns"] <= p["bracket_checked_monotonic_ns"]
              assert p["detach"]["superseded_commit_line"] == p["protocol"]["commit"]["line"]
              assert r["idle_capture"]["size"] == p["capture"]["size"] == r["commit"]["image"]["size"]
              records[role] = r
          assert records["A"]["binary_sha256"]["notes"] == records["B"]["binary_sha256"]["notes"]
          assert records["A"]["binary_sha256"]["jwm"] != records["B"]["binary_sha256"]["jwm"]
          assert records["A"]["idle_capture"]["size"] == records["B"]["idle_capture"]["size"]
          review = {"status": "pixel-review-required", "A": "No readable candidate popup expected",
                    "B": "Readable numbered Chinese candidates expected at anchored ROI, absent after commit",
                    "note": "Workflow exit is not visual pass. Compare three PNGs per run against logged geometry."}
          (root/"visual-review-required.json").write_text(json.dumps(review, indent=2) + "\n")
          print(review)
          PY
      - name: Retain PNG, protocol, source pins and failed-case evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: winit-ime-popup-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
