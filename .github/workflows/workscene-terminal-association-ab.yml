name: Workscene terminal association A/B on X11
on:
  pull_request:
    branches: ['dot/workscene-terminal-association-ab-base']
    types: [opened, synchronize, reopened, converted_to_draft]
    paths:
      - '.github/workflows/workscene-terminal-association-ab.yml'
      - 'scripts/test-workscene-terminal-association.py'

permissions:
  contents: read

concurrency:
  group: workscene-terminal-association-ab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  A: a1c5f307eea47f9e01e17a60900d3cf40c7d610b
  A_TREE: a6429d24ded9aa8c031e75cf9cbe6c7f5a5276eb
  B: 324a2b9a261308535cdb8a4d7bf54b614d4dbf88
  B_TREE: 95da12b40a791773016623cd5dbd987e31a95b92

jobs:
  evidence:
    if: >-
      github.repository == 'beamiter/jwm' &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'dot/workscene-terminal-association-ab-base' &&
      github.event.pull_request.head.ref == 'dot/workscene-terminal-association-ab-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize always-retained evidence
        run: mkdir -m 700 evidence
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: fixture
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/jwm
          ref: ${{ env.B }}
          fetch-depth: 4
          path: source-b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: beamiter/jwm
          ref: ${{ env.A }}
          fetch-depth: 4
          path: source-a
          persist-credentials: false
      - name: Verify exact pins and validation-only scope
        timeout-minutes: 3
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_BASE" = "$A"
          test "$(git -C fixture rev-parse HEAD)" = "$EVENT_HEAD"
          git -C fixture merge-base --is-ancestor "$A" HEAD
          git -C fixture diff --exit-code "$A" HEAD -- . ':!.github/workflows/workscene-terminal-association-ab.yml' ':!scripts/test-workscene-terminal-association.py'
          test "$(git -C source-a rev-parse HEAD)" = "$A"
          test "$(git -C source-a rev-parse 'HEAD^{tree}')" = "$A_TREE"
          test "$(git -C source-b rev-parse HEAD)" = "$B"
          test "$(git -C source-b rev-parse 'HEAD^{tree}')" = "$B_TREE"
          test "$(git -C fixture rev-parse "$A^{tree}")" = "$A_TREE"
          test "$(git -C source-b rev-parse 'HEAD^')" = "$A"
          expected_paths=$(printf '%s\n' src/jwm/features/agent_sessions.rs src/jwm/features/launcher.rs src/jwm/features/workscenes.rs)
          test "$(git -C source-b diff --name-only "$A" HEAD)" = "$expected_paths"
          for d in fixture source-a source-b; do
            test -z "$(git -C "$d" -c core.fsmonitor=false status --porcelain --untracked-files=all)"
            git -C "$d" rev-parse HEAD 'HEAD^{tree}' > "evidence/${d}-revision.txt"
          done
          sha256sum fixture/scripts/test-workscene-terminal-association.py > evidence/fixture.sha256
          /usr/bin/python3 -I -m py_compile fixture/scripts/test-workscene-terminal-association.py
      - name: Install signed native X11 and app dependencies
        timeout-minutes: 12
        env:
          JWM_CI_PREFETCH_CJK: "1"
        run: |
          set -euo pipefail
          unset JWM_CI_APT_SOURCES
          bash source-b/scripts/ci-install-deps.sh build-essential pkg-config libglib2.0-bin libglib2.0-dev \
            libcairo2-dev libpango1.0-dev libasound2-dev libdbus-1-dev libudev-dev libinput-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxext-dev libxxf86vm-dev libxcb1-dev \
            libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxrandr-dev libxrender-dev xvfb xauth xdotool x11-utils x11-xserver-utils imagemagick dbus-x11 fonts-noto-cjk \
            2>&1 | tee evidence/dependency-install.log
          command -v xmessage
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        timeout-minutes: 6
        with:
          toolchain: stable
      - name: Cold exact X11 release builds
        timeout-minutes: 65
        run: |
          set -euo pipefail
          toolbin="$(dirname "$(rustup which cargo)")"
          mkdir -m 700 build-home build-cargo build-config
          "$toolbin/cargo" --version --verbose > evidence/cargo.txt
          "$toolbin/rustc" --version --verbose > evidence/rustc.txt
          sha256sum "$toolbin/cargo" "$toolbin/rustc" /usr/bin/python3 > evidence/tools.sha256
          build() {
            local origin="$1" expected="$2" log="$3" bound="$4"
            shift 4
            (
              cd "$origin"
              test -z "$(git -c core.fsmonitor=false status --porcelain --untracked-files=all)"
              test "$(git rev-parse HEAD)" = "$expected"
              env -i PATH="$toolbin:/usr/bin:/bin" HOME="$GITHUB_WORKSPACE/build-home" \
                CARGO_HOME="$GITHUB_WORKSPACE/build-cargo" XDG_CONFIG_HOME="$GITHUB_WORKSPACE/build-config" \
                RUSTC="$toolbin/rustc" CARGO_BUILD_JOBS=2 LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null \
                timeout -k 15s "$bound" "$toolbin/cargo" "$@"
              test -z "$(git -c core.fsmonitor=false status --porcelain --untracked-files=all)"
              test "$(git rev-parse HEAD)" = "$expected"
            ) 2>&1 | tee "$log"
          }
          test ! -e source-b/target
          build source-a "$A" evidence/jwm-a-build.log 25m build --locked --release --no-default-features --features backend-x11rb --bin jwm --bin jwm-tool
          build source-b "$B" evidence/jwm-b-build.log 25m build --locked --release --no-default-features --features backend-x11rb --bin jwm --bin jwm-tool
          sha256sum source-{a,b}/target/release/{jwm,jwm-tool} > evidence/binaries.sha256
      - name: Check Workscene keyboard routing, focus and reveal in private JWM X11
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sha256sum -c evidence/binaries.sha256
          sha256sum -c evidence/fixture.sha256
          response=0
          for role in a b; do
            scope=$(mktemp -d)
            install -d -m 700 "$scope"/{config,data,run,cache}
            product="$PWD/source-$role"
            expect=baseline
            if [[ "$role" == b ]]; then expect=fixed; fi
            if ! env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 HOME="$scope" \
              XDG_CONFIG_HOME="$scope/config" XDG_DATA_HOME="$scope/data" XDG_RUNTIME_DIR="$scope/run" \
              XDG_CACHE_HOME="$scope/cache" JWM_WORKSCENE_PRIVATE=1 GSETTINGS_BACKEND=memory \
              LIBGL_ALWAYS_SOFTWARE=1 timeout -k 5s 130s dbus-run-session -- \
              xvfb-run --auto-servernum --server-args="-screen 0 1280x900x24 -noreset -nolisten tcp" \
              bash -s -- "$PWD" "$product" "$scope" "$role" "$expect" \
              > "evidence/$role-session.log" 2>&1 <<'PRIVATE_X11'
          set -euo pipefail
          repo=$1 product=$2 scope=$3 role=$4 expect=$5
          jwm="$product/target/release/jwm"
          driver="$repo/fixture/scripts/test-workscene-terminal-association.py"
          out="$repo/evidence/$role"
          mkdir -m 700 "$scope/system-data"
          export XDG_DATA_DIRS="$scope/system-data"
          export PATH="$scope/bin:/usr/bin:/bin"
          export JWM_SOCKET="$scope/run/jwm-ipc.sock"
          arms=()
          if [[ "$expect" = fixed ]]; then arms+=(--candidate); fi
          args=(--out "$out" "${arms[@]}")
          "$jwm" --backend x11rb --gen-config
          config="$scope/config/jwm/config_x11.toml"
          test -f "$config"
          sed -i 's/show_bar = true/show_bar = false/;s/wallpaper_effect = "daily"/wallpaper_effect = "none"/;s/eva_companion_enabled = true/eva_companion_enabled = false/' "$config"
          # The hosted Xvfb Mesa EGL does not expose EGL_KHR_image_pixmap.
          # Exercise the real X11 GLX renderer, as the monitor-swap fixture does.
          sed -i 's/^compositor_api = .*/compositor_api = "glx"/' "$config"
          grep -Fx 'compositor_api = "glx"' "$config"
          cat >> "$config" <<'TOML'

          [[workscenes]]
          name = "Pane Witness"
          sessions = ["fixture:workscene-session"]
          [[workscenes.outputs]]
          output = ""
          tag = 1
          TOML
          "$jwm" --backend x11rb --check-config
          "$jwm" --backend x11rb > "$repo/evidence/$role-jwm.log" 2>&1 &
          wm=$!
          trap 'kill "$wm" 2>/dev/null || true; wait "$wm" 2>/dev/null || true' EXIT
          for _ in $(seq 1 80); do
            if test -S "$JWM_SOCKET" && xprop -root _NET_SUPPORTING_WM_CHECK | grep -Eq '0x[1-9a-f][0-9a-f]*'; then
              break
            fi
            kill -0 "$wm"
            sleep .1
          done
          xprop -root _NET_SUPPORTING_WM_CHECK | tee "$repo/evidence/$role-wm-ready.txt"
          grep -Eq '0x[1-9a-f][0-9a-f]*' "$repo/evidence/$role-wm-ready.txt"
          /usr/bin/python3 -I "$driver" "${args[@]}"
          PRIVATE_X11
            then
              response=1
            fi
            rm -rf -- "$scope"
          done
          exit "$response"
      - name: Retain PNG, protocol, source pins and failed-case evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workscene-terminal-association-ab-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
