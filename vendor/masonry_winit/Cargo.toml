[package]
name = "masonry_winit"
version = "0.4.0"
description = "Data-oriented Rust UI design toolkit."
keywords = [
    "gui",
    "ui",
    "toolkit",
]
categories = [
    "gui",
    "internationalization",
    "accessibility",
]
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/linebender/xilem"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
cargo-args = [
    "-Zunstable-options",
    "-Zrustdoc-scrape-examples",
]

[features]
default = [
    "imaging_vello",
]
imaging_vello = [
    "masonry_imaging/imaging_vello",
]
imaging_vello_hybrid = [
    "masonry_imaging/imaging_vello_hybrid",
]
imaging_skia = [
    "masonry_imaging/imaging_skia",
]
tracy = [
    "dep:tracing-tracy",
    "dep:vello",
    "dep:wgpu-profiler",
    "wgpu-profiler/tracy",
    "masonry_core/tracy",
    "vello/wgpu-profiler",
]

[dependencies]
pollster = "0.4.0"
copypasta = "0.10.2"

[dependencies.masonry_core]
version = "0.4.0"
default-features = false
git = "https://github.com/linebender/xilem"
rev = "78d4f4b6878a1c2e2884edd72d7ecd83f1f6f704"

[dependencies.winit]
version = "0.30.13"

[dependencies.tracing]
version = "0.1.44"
default-features = false
features = [
    "default",
]

[dependencies.tracing-tracy]
version = "0.11.4"
optional = true

[dependencies.ui-events-winit]
version = "0.3.0"
default-features = false

[dependencies.accesskit_winit]
version = "0.32.2"
default-features = false
features = [
    "accesskit_unix",
    "tokio",
    "rwh_06",
]

[dependencies.masonry_imaging]
version = "0.4.0"
default-features = false
git = "https://github.com/linebender/xilem"
rev = "78d4f4b6878a1c2e2884edd72d7ecd83f1f6f704"

[dependencies.vello]
version = "0.8.0"
default-features = false
features = [
    "wgpu",
]
optional = true

[dependencies.wgpu]
version = "28.0.0"

[dependencies.wgpu-profiler]
optional = true
version = "0.26.0"
default-features = false

[dependencies.x11rb]
version = "0.14"
default-features = false

[target."cfg(target_os = \"macos\")".dependencies.wgpu]
version = "28.0.0"
features = [
    "metal",
]

[dev-dependencies.masonry]
git = "https://github.com/linebender/xilem"
rev = "78d4f4b6878a1c2e2884edd72d7ecd83f1f6f704"
version = "0.4.0"

[lints.rust]
unsafe_code = "deny"
keyword_idents_2024 = "forbid"
non_ascii_idents = "forbid"
non_local_definitions = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(compile_stress_test)",
]

[lints.clippy]
too_many_arguments = "allow"
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
collection_is_never_read = "warn"
default_trait_access = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
large_stack_arrays = "warn"
mismatching_type_param_order = "warn"
missing_assert_message = "warn"
missing_fields_in_debug = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
should_panic_without_expect = "warn"
todo = "warn"
unseparated_literal_suffix = "warn"
use_self = "warn"
cargo_common_metadata = "warn"
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"

[workspace]
