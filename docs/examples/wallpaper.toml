# Wallpaper example (TOML, not YAML).
# Merge these keys into the existing [behavior] section of config_x11.toml;
# do not add a second [behavior] or duplicate keys. Replace example paths/connectors.
# Celestial effects require the X11 compositor. Native Wayland uses static wallpaper.
[behavior]

# Live effect: "off" (default) = static; "astronomy" = configurable celestial scenes.
# Legacy "solar-system" remains supported; use scene = "solar-system" in new layouts.
wallpaper_effect = "astronomy"
# Native picker: Alt+Ctrl+W; Apply to chooses all screens or a connector/group.
# Select a scene, layout or Share with row; celestial choices persist in the config.
# About rows provide reference dimensions, material provenance and source URLs.
# Scene tokens: earth, moon, sun, mercury, venus, mars, jupiter, saturn, uranus,
# neptune, solar-system, galaxy. This global scene is also the hotplug fallback.
wallpaper_astronomy_scene = "earth"
# "span" (default): one shared scene across the whole framebuffer.
# "mirror": one complete view per screen, with shared camera/interaction.
# "independent": a scene per connector; a nonempty group spans its named members.
# Legacy "per-output" = Earth per screen; "earth-moon" uses the old bodies map below.
wallpaper_astronomy_layout = "independent"
# Replace connector names with your actual outputs. Unplugged assignments are retained.
# Same scene alone does not share navigation; group names explicitly join screens.
# Every member of a group must specify the same scene.
wallpaper_astronomy_outputs = { "DP-1" = { scene = "earth", group = "earth-desk" }, "DP-2" = { scene = "earth", group = "earth-desk" }, "HDMI-1" = { scene = "solar-system" } }
# Delete group or set group = "" for an independent canvas. For example:
# wallpaper_astronomy_outputs = { "DP-1" = { scene = "saturn" }, "HDMI-1" = { scene = "galaxy" } }
# Scientific uses restrained lighting and labels approximate materials; it does not
# imply measured terrain or true physical display scale. Illustrative enables art layers.
wallpaper_astronomy_presentation = "scientific"

# Solar orbital mode and clocks are global across Solar System scenes.
# JPL approximate positions are the default; "illustrative" retains the decorative tour.
# Both modes compress distances and enlarge bodies for visible, clickable navigation.
# Native Global date-derived clock actions also select ephemeris, including Pause.
wallpaper_solar_orbit_mode = "ephemeris"
# Finite 0..1000000: 0 pauses orbital date, 1 follows UTC + offset, 86400 = 1 day/second.
wallpaper_solar_time_scale = 1.0
# Finite -19000..8500 days relative to current UTC, reanchors playback when changed.
# Runtime dates clamp to 1972-01-01 through 2049-12-31 23:58 UTC; no extrapolation.
wallpaper_solar_time_offset_days = 0.0
# Self-rotation is separate: finite 0..10000, 1 = sidereal real time, 0 stops spin.
# Default 718.035 makes Earth turn in 120 seconds even when orbital date is at 1x.
wallpaper_solar_spin_speed = 718.035
# Solar clock changes never retime the independent Earth/Moon UTC day/night/phase.
# Full accuracy boundaries and sources: docs/astronomy-science.md.

# Mouse: hold left button on the visible body and drag in any direction.
# Edge drags also roll; release keeps the pose and resumes any automatic tour.
# Wheel over a gallery body scales it from 0.35x to 8x; scenes keep independent zoom.
# Left-drag empty sky to look through the entire celestial sphere, including poles.
# Wheel over sky changes the perspective lens (Astronomy vertical FOV 8..110 degrees).
# The sky tour defaults to 1440 minutes; wallpaper_sky_rotation_minutes = 0 stops
# automatic sky movement while leaving manual panorama navigation available.
# Gestures start on uncovered wallpaper; window/bar/modal bindings keep priority.
# A captured gesture can continue across windows and other outputs.
# Manual poses, zoom and lens are session-only; no extra enable key.
# Changing a body's orientation/mode/period resets its manual pose and zoom.
# Solar System: click Sun/planet for an isolated close-up; drag to orbit, sky to look.
# Wheel on a focused body approaches/recedes; right-click uncovered wallpaper
# restores the saved overview. A drag never becomes a click by returning to its start.
# Shared controls, detail and sky sources: docs/celestial-explorer.md.

# Empty strings (defaults) load the installed bundled NASA textures.
# Custom example: wallpaper_earth_texture = "/home/alice/Pictures/earth.jpg"
# Custom maps must be decodable 2:1 equirectangular images.
# Above 1.3x, Astronomy lazily requests Earth native 5400 / Moon 8192 detail where
# available and GPU-supported. Explicit custom maps remain authoritative.
wallpaper_earth_texture = ""
wallpaper_moon_texture = ""

# Earth applies in every Astronomy layout. Default "fixed" keeps this center
# and orientation while real sunlight moves; "rotating" enables the axis tour.
wallpaper_earth_view = "fixed"
wallpaper_earth_latitude = 23.13 # finite degrees, -90..90; north positive
wallpaper_earth_longitude = 113.28 # finite degrees, -180..180; east positive
wallpaper_earth_roll = 0.0 # finite degrees, -180..180; initial image orientation
wallpaper_earth_rotation_axis = [0.0, 1.0, 0.0]
# Integer minutes per turn, 1..525600; used only by the "rotating" view.
wallpaper_earth_rotation_minutes = 1440

# Moon applies whenever a Moon gallery scene is selected. Default "rotating" preserves its
# original texture tour; "fixed" stops texture motion while real lunar phase updates.
wallpaper_moon_view = "rotating"
wallpaper_moon_latitude = 10.313240312354818 # original 0.18-radian tilt; -90..90
wallpaper_moon_longitude = 0.0 # -180..180
wallpaper_moon_roll = 0.0 # -180..180
wallpaper_moon_rotation_axis = [0.0, 1.0, 0.0]
# About 27.3 days. Use Earth = 20 and Moon = 30 for faster decorative tours.
wallpaper_moon_rotation_minutes = 39343

# Both axes are [x, y, z] in body coordinates, each component finite in -1..1,
# and at least one nonzero. JWM normalizes them; negate all components to reverse.
# +X = equator at 90 degrees east; +Y = north pole; +Z = equator at zero longitude.
# With latitude = longitude = roll = 0:
#   [0, 1, 0] = horizontal, [1, 0, 0] = vertical, [1, 1, 0] = diagonal,
#   [-1, -1, 0] = reversed diagonal, [0, 0, 1] = around the viewing direction.
# Other centers use the same body axes, which do not always align with the screen.
# For examples and immediate hot updates, see docs/astronomy-wallpaper.md.

# Compatibility settings; they do not change the viewing longitude or sunlight.
# Earth uses wallpaper_earth_longitude and the fixed/rotating view above.
# Both bodies use the actual current system instant, converted to UTC once.
# Timezone/DST changes never add another offset to sunlight or lunar phase.
wallpaper_astronomy_timezone = "system"
# Integer hours, -12..14; default 8. No operating-system timezone changes.
wallpaper_timezone_offset_hours = 8

# Earth-moon only: replace connector names with your actual output names.
# Default {} alternates Earth/Moon by sorted connector name; a single output gets Earth.
# Explicit assignments stay stable when another output disconnects.
# If your config already has [behavior.wallpaper_astronomy_bodies], edit that
# subtable instead: "DP-1" = "earth" and "HDMI-1" = "moon" on separate lines.
# Use either the inline map below or the subtable, never both.
wallpaper_astronomy_bodies = { "DP-1" = "earth", "HDMI-1" = "moon" }

# Static fallback, restored when the celestial effect is off/unavailable.
# Generated default is jwm/wallpaper.jpg in your config directory.
# With no override/daily rotation, "" loads no static image and shows the
# backend's default desktop background (theme-dependent without the compositor).
# Example: wallpaper = "/home/alice/Pictures/Wallpapers/forest.jpg"
wallpaper = ""
# Static images only; Astronomy body scale uses the mouse wheel. Default "fill".
# fill = preserve aspect and crop; fit = show whole image with margins;
# stretch = distort to fill; center = unscaled and centered (may crop).
wallpaper_mode = "fill"

# Smooth transitions for global and independent monitor/tag image replacements.
# The old image stays visible until the new decode/upload succeeds.
# Default true / 500 ms. Disabling releases the old transition textures.
wallpaper_crossfade = true
wallpaper_crossfade_duration_ms = 500

# "off" (default) or "daily" (local calendar date, different images per output slot).
# Automatic daily selection from a nonempty collection overrides static monitor/tag choices.
# The celestial effect stays on top; the daily fallback continues underneath.
wallpaper_rotation = "off"
# Example: ["/home/alice/Pictures/a.jpg", "/home/alice/Pictures/b.jpg"]
wallpaper_rotation_paths = []
# Picking a static image disables the celestial effect. With a nonempty daily collection,
# the manual pick replaces only the global fallback; monitor/tag overrides still apply.
# It lasts for today in this session; reload discards it. The collection is retained.

# Picker directory: default "" tries current image's directory,
# then ~/Pictures/Wallpapers, then ~/Pictures.
wallpaper_dir = ""
# Default true: derive accent colors in memory. false + reload restores file colors.
wallpaper_colors = true

# Static override examples (default []); indices are zero-based.
# Priority: tag+monitor > tag+any monitor > monitor > global; automatic daily selection overrides all.
# Empty mode inherits wallpaper_mode; monitor = -1 matches any monitor for tags.
# wallpaper_monitors = [{ monitor = 0, path = "/home/alice/Pictures/a.jpg", mode = "fit" }]
# wallpaper_tags = [{ tag = 0, monitor = -1, path = "/home/alice/Pictures/work.jpg", mode = "" }]
wallpaper_monitors = []
wallpaper_tags = []
